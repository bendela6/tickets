title: bh-format
summary: Prettier with bh's settings, Tailwind's class order, and the files it leaves alone.
order: 3
related: [bh-lint, 'tokens:build', Versions and updates]
body:
  - |
    Prettier with bh's settings, Tailwind's class order, and the files it
    leaves alone.

    `bh-format` is Prettier, run from `@bh/config`'s dependencies with the
    arguments you give it. Its settings come from the root `package.json`,
    which names them: `"prettier": "@bh/config/prettier"`.
  - h2: Running it
  - code: |
      bh-format --write .
      bh-format --check .
      bh-format --write src/rows.tsx
    lang: sh
    numbers: false
  - |
    At bh's root, `pnpm format` writes every file, and `pnpm format:check`
    changes nothing and fails on any file it would change. It formats
    TypeScript, JavaScript, JSON, YAML, CSS and markdown alike: `pnpm
    docs:sync` runs it on each page's markdown copy.
  - h2: The settings
  - |
    | Setting         | Value                         | So                                                       |
    | --------------- | ----------------------------- | -------------------------------------------------------- |
    | `printWidth`    | `100`                         | a line breaks past 100 columns                           |
    | `singleQuote`   | `true`                        | `'text'` in code; JSX attributes keep `"`                |
    | `semi`          | `true`                        | every statement ends with `;`                            |
    | `trailingComma` | `'all'`                       | a comma after the last item of anything broken over lines, arguments too |
    | `tabWidth`      | `2`                           | two spaces                                               |
    | `plugins`       | `prettier-plugin-tailwindcss` | class names in Tailwind's order                          |
  - h2: Tailwind's order
  - |
    The plugin sorts the classes in a `className`. It knows Tailwind's own
    classes, not Instrument's: no stylesheet is named for it, so `text-13`,
    `bg-gray-2` and `rounded-6` are unknown to it. Those stay first, in the
    order written, and Tailwind's own follow in Tailwind's order. As written:
  - code: |
      export const Tag = () => <span className="text-13 p-16 flex bg-gray-2 rounded-6">Fern</span>;
    lang: tsx
  - |
    As `bh-format` leaves it:
  - code: |
      export const Tag = () => <span className="text-13 bg-gray-2 rounded-6 flex p-16">Fern</span>;
    lang: tsx
  - h2: What it leaves alone
  - |
    Prettier skips what `.gitignore` and `.prettierignore` list. bh's
    `.prettierignore` names the lockfile and `@bh/ui`'s generated token
    files: [`tokens:verify`](/tooling/tokens-build) compares those with a
    fresh build, so a reformatted one would fail it.

    An app leaves out its copies the same way. They are formatted in bh, and
    a copy Prettier rewrote in the app is a copy edited there: the gateway's
    bh page shows it as edited, and the next
    [update](/getting-started/versions#updating-an-app) stops on it:
  - code: |
      packages/bh
      pnpm-lock.yaml
    lang: text
    file: .prettierignore
  - h2: Beside the lint
  - |
    `base` ends with `eslint-config-prettier`, so no lint rule asks for a
    layout Prettier undoes. One rule meets Prettier's work: Prettier wraps an
    arrow too long for its line, and
    [`bh/multiline-arrow-needs-body`](/tooling/bh-lint#bh-multiline-arrow-needs-body)
    then asks for a block. Write the block, or let `bh-lint --fix` write it
    and `bh-format` lay it out.
  - h2: Rules
  - |
    - One set of settings for the whole repo, named in the root
      `package.json`; no project has its own.
    - Generated files and bh's copies in an app are not formatted where they
      land.
    - Class order is Tailwind's for Tailwind's classes; Instrument's keep the
      order they were written in.
