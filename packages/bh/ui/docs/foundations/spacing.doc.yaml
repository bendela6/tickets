title: Spacing
summary: One pixel is the unit, so the number in a spacing or size class is pixels on screen.
order: 4
related: [Radius, Typography]
body:
  - |
    The number in a spacing class is pixels: `p-16` is sixteen.

    `--spacing` is `1px`, where Tailwind's own is `0.25rem`, which made spacing
    the one place a number was multiplied by four before it reached the screen.
    Widths, heights and gaps share the unit: `h-36`, `w-96`, `gap-8`, `size-20`.
  - tokens: spacing
  - h2: The numbers in use
  - |
    Any whole number compiles, and there is no closed scale. In `@bh/ui`'s own
    components, 8 is by far the most common, then 12, 6, 4, 16 and 2; 24 and
    32 are rare.
  - h2: Control heights
  - |
    Controls come in three heights, and a field's height, radius, padding and
    type size move together:

    | Size | Field | Button (`sm`, `md`, `lg`) |
    | ---- | ----- | ------------------------- |
    | small | 30, `xs` | 28 |
    | medium | 38, `md` | 36 |
    | large | 46, `lg` | 44 |

    `md` is the default of both.
