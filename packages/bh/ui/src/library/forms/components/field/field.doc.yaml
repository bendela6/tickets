title: Field
summary: 'A field laid out by hand: its label, its control, then a hint or an error, stacked.'
related: [FieldWrapper, FieldLabel, FieldError, Input]
body:
  - |
    A field laid out by hand: its label, its control, then a hint or an
    error, stacked.

    It is for a form written as JSX, field by field. A form drawn by
    `@bh/form` wraps its fields in [FieldWrapper](/components/forms/field-wrapper)
    instead.
  - h2: Import
  - code: import { Field } from '@bh/ui';
    lang: tsx
  - h2: Examples
  - |
    `id` is the control's id, and the label is a
    [FieldLabel](/components/forms/field-label) for it. `hint` is the line
    under the control, which it describes, and `required` marks the label.
  - demo: examples/a-field.tsx
  - |
    An `error` takes the hint's place, as a
    [FieldError](/components/forms/field-error), and describes the control
    in its place. Give the control `tone="danger"` too, for the red halo
    the message goes with.
  - demo: examples/with-an-error.tsx
  - |
    With no `id` the label names a group of controls, each named by its own
    `aria-label`: the field is a `role="group"` named by its caption and
    described by the line under it.
  - demo: examples/a-group.tsx
  - |
    `className` reaches the field's own box, so a form gives each field the
    width its value needs: an address wider than a port.
  - demo: examples/widths.tsx
  - h2: Keyboard and accessibility
  - |
    With an `id`, the label is a `<label>` for the control, which it names,
    and a click on it focuses the control. The asterisk is part of the
    label's text. The hint is at `<id>-hint` and the error at `<id>-error`.
    When the control is the field's own child, the field adds whichever is
    shown to the control's `aria-describedby`, after any ids it has there
    already; a control further down, in a row of its own, points its
    `aria-describedby` at them itself. Without an `id`, the field names and
    describes the group itself. An error is a `role="alert"`, announced when
    it appears.
  - h2: Field or FieldWrapper
  - |
    - **Field** is for a form laid out by hand. It always stacks, its hint
      can be any node, a link in it say, it can name a group, and a form
      gives it its width.
    - **FieldWrapper** is the field slot of the registry `@bh/form` draws
      with. It takes the props the form gives a field, puts its label beside
      the control once the field is 520 pixels wide, and its description is
      a string.
  - h2: Props
  - props: Field
