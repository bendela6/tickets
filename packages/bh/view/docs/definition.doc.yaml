title: A view's definition
summary: "Define a view as JSON: the resource it shows, its host and the host's columns or item, the filters it offers, and its sort, grouping, page size and density."
order: 1
related: [Columns, A view's state, The resource contract]
body:
  - |
    Define a view as JSON: the resource it shows, its host and the host's
    columns or item, the filters it offers, and its sort, grouping, page size
    and density.

    `@bh/view` says what a view is made of, as JSON with no functions in it,
    so a view is stored as it is and a server checks it as a browser draws it.
    This is what its author registers, its definition. What a reader changes
    in it (the columns shown, their order and widths, the sort, the filters,
    the groups folded) is its state, kept apart from it and stored by the
    view's key ([A view's state](/views/state)). The package imports no React. Every type this page names is
    defined under [Types](#types).
  - h2: A view
  - |
    A table of open items: two columns, a filter form with a search and
    rules, which opens on the items assigned to the reader; their status's
    order, a band for each kind of status, 50 rows a page, compact:
  - code: |
      {
        "key": "open",
        "label": "Open items",
        "resource": "items",
        "host": "table",
        "columns": [
          {
            "fixed": {
              "key": "name",
              "label": "Name",
              "width": { "mode": "fill", "min": 240 }
            },
            "template": { "field": "title" }
          },
          {
            "fixed": {
              "key": "status",
              "label": "Status",
              "sort": "status",
              "filter": {
                "field": "status.kind",
                "op": "in",
                "control": "toggle-chips"
              }
            },
            "template": { "field": "status", "renderer": "pill" }
          }
        ],
        "filters": {
          "form": {
            "nodes": [
              { "kind": "field", "name": "search", "type": "search", "config": {} },
              {
                "kind": "field",
                "name": "rules",
                "type": "rules",
                "config": {},
                "filter": { "rules": true }
              }
            ]
          },
          "default": {
            "filter": { "all": [{ "field": "assignee", "op": "isMe" }] }
          }
        },
        "sort": [{ "field": "status", "dir": "asc" }],
        "group": { "field": "status.kind", "all": true },
        "pageSize": 50,
        "density": "compact"
      }
    lang: json
  - h2: Its parts
  - |
    Its `key`, `label`, `resource` and `host` are needed, and the host's own
    part: a table's `columns`, or an item for the others. The rest say what
    they do when absent.

    | Part       | What it is                                                         | When absent            |
    | ---------- | ------------------------------------------------------------------ | ---------------------- |
    | `key`      | names it, and its state; unique among an app's views               | (needed)               |
    | `label`    | what it's called where a reader picks it                           | (needed)               |
    | `resource` | the resource it shows, by its name in the resource's metadata      | (needed)               |
    | `host`     | what it shows rows in: `table`, `list`, `tiles` or `cards`         | (needed)               |
    | `columns`  | a table's columns, in their order, each named once by its key      | (a table's, needed)    |
    | `item`     | a list's, tiles' or cards' item: its fixed parts and its template  | (the others', needed)  |
    | `filters`  | the filter form it offers, and the search and filter it opens with | none                   |
    | `sort`     | its rows' order when it opens                                      | the resource's own     |
    | `group`    | a band of rows for each value of a field                           | no bands               |
    | `pageSize` | the rows a page takes, 1 to 500                                    | the resource's own     |
    | `density`  | how tightly its rows sit: `comfortable` or `compact`               | `comfortable`          |
  - h2: Its host
  - |
    A view names its host and holds its config; the host draws it. A table
    holds `columns`, each a host of its own: its key, label, width, sort and
    header filter, and its cell, a template ([Columns](/views/columns)). A
    list, tiles and cards hold one `item`, every row drawn by it: its fixed
    parts, the ones its kind of host draws (a list item's leading picture, a
    tile's cover, a card's icon), and its template, the same JSON a column's
    cell is ([Templates](/templates/overview)).

    An item's fixed parts are checked as a JSON object for now: each kind of
    host says what its own are, and the view's check takes them from it. A
    board is cards grouped, a band of cards for each status, the empty ones
    too:
  - code: |
      {
        "key": "board",
        "label": "Board",
        "resource": "items",
        "host": "cards",
        "item": {
          "fixed": { "icon": "square" },
          "template": {
            "layout": "flex",
            "options": { "direction": "column", "gap": 4 },
            "nodes": [
              { "field": "title" },
              { "field": "assignee", "renderer": "user" }
            ]
          }
        },
        "group": { "field": "status", "all": true }
      }
    lang: json
  - h2: Its filters
  - |
    `filters` is the filter form a view offers, `form`, and what it opens
    with, `default`. The form is a form's config as JSON: its `nodes`, each
    field drawn by an input and holding a part of the query's filter by its
    `filter` key, as the filter form has them. Its value is the query's
    search and filter, `{ search, filter }`, and `default` is that value
    when the view opens.

    The form starts empty and is given the view's value apart from it, so
    its Clear empties it rather than going back to the view's. Each field
    shows the part of the value it holds, and a column's header filter is
    one of them: a column filter's own `default` joins the view's when it
    opens.

    The form is checked loosely for now: JSON, its `nodes` JSON objects. The
    filter form's own schema will check its node kinds and each field's
    `filter`, and the view's check its inputs and operators. What isn't JSON
    (a form's `schema`, a config key a function loads) is the app's to add
    where it draws the form.
  - h2: Its rows
  - |
    - **`sort`** is a list of keys, each a field's path and its direction,
      `[{ "field": "status", "dir": "asc" }]`, as a query's sort is. A
      reader's click on a column's header replaces it.
    - **`group`** puts a band of rows for each value of an option, ref or
      boolean field, or an option's attribute (`"status.kind"`), with `dir`
      for the bands' order and `all` to show the bands no row is in too.
    - **`pageSize`** is the rows a page takes, a whole number from 1 to 500,
      as a query's `take` is.
    - **`density`** is how tightly the rows sit, as the table draws them:
      `comfortable` or `compact`.

    Which fields sort and group is the resource's to say, in its metadata;
    [The resource contract](/resources/contract) has the query whole.
  - h2: Checking a view
  - |
    `View` is a view's valibot schema by its shape, its columns' operators
    any name. `viewOf(registry)` checks each operator is one the app's
    registry holds (`@bh/resource`'s `createRegistry`): bh's fifteen when
    none is given, and the app's own beside them. Each problem is reported
    at its own path, every one at once:
  - code: |
      import * as v from 'valibot';
      import { createRegistry, issuesOf } from '@bh/resource';
      import { viewOf } from '@bh/view';

      declare const stored: string;

      const result = v.safeParse(viewOf(createRegistry()), JSON.parse(stored));
      if (!result.success) {
        // [{ path: ['columns', 2, 'fixed', 'key'],
        //    message: 'two columns are "status"' }]
        console.log(issuesOf(result.issues));
      }
    lang: ts
  - |
    A view's own schema checks what it can alone: its parts' shapes, its
    host's own part (columns for a table, an item for the others), its
    columns each named once, its operators registered, its templates JSON
    with a template's node at their root, and a page size from 1 to 500.
    Whether its resource is the app's, whether its fields are the
    resource's and sort or group, whether a field allows its operator, and
    what its templates' parts and layouts hold, the view's check of the
    whole view says, against the resource's metadata and the template's
    registries.
  - h2: Types
  - |
    Every type above, as the package exports it. `View`, `FilterValue`,
    `FilterFormConfig`, `ViewFilters`, `Density` and `ItemHost` are also
    valibot schemas of the same names. A view's type takes an app's own
    layouts for its templates, as a template's does.
  - code: |
      import type * as v from 'valibot';
      import type { Filter, GroupBy, Json, Sort } from '@bh/resource';
      import type { Host } from '@bh/template';
      import type { Column } from '@bh/view';

      /** A view as its author registers it: a table, or a list, tiles or cards. */
      export type View = TableView | ItemView;

      /** What every view holds, whatever its host. */
      export interface ViewBase {
        /** Names it, and its state; unique among an app's views. */
        key: string;
        /** What it's called where a reader picks it. */
        label: string;
        /** The resource it shows, by its name. */
        resource: string;
        /** The filters it offers; none when absent. */
        filters?: ViewFilters;
        /** Its rows' order when it opens; the resource's own when absent. */
        sort?: Sort[];
        /** A band of rows for each value of a field; none when absent. */
        group?: GroupBy;
        /** The rows a page takes, 1 to 500; the resource's own when absent. */
        pageSize?: number;
        /** How tightly its rows sit; comfortable when absent. */
        density?: Density;
      }

      /** A view shown in a table: its columns, in their order. */
      export interface TableView extends ViewBase {
        host: 'table';
        /** Each named once by its key. */
        columns: Column[];
      }

      /** A view shown as a list, tiles or cards: each row an item. */
      export interface ItemView extends ViewBase {
        host: ItemHost;
        item: ViewItem;
      }

      /** The hosts a view shows its rows in besides a table. */
      export type ItemHost = 'list' | 'tiles' | 'cards';

      /** An item: its kind's fixed parts, as JSON for now, and its template. */
      export type ViewItem = Host<Record<string, Json>>;

      /** The filters a view offers: a filter form, and the value it opens with. */
      export interface ViewFilters {
        form: FilterFormConfig;
        /** The search and filter it opens with; none when absent. */
        default?: FilterValue;
      }

      /** A filter form's config, as JSON: its nodes, and its options beside them. */
      export type FilterFormConfig = {
        nodes: Record<string, Json>[];
      } & { [option: string]: Json };

      /** A filter form's value: the query's search and filter. */
      export interface FilterValue {
        search?: string;
        filter?: Filter;
      }

      /** How tightly a view's rows sit. */
      export type Density = 'comfortable' | 'compact';

      /** A view's schema by its shape: any operator's name. */
      export declare const View: v.GenericSchema<unknown, View>;

      /** A view's schema, its operators the registry's: bh's fifteen by default. */
      export declare function viewOf(
        registry?: ColumnRegistry,
      ): v.GenericSchema<unknown, View>;

      /** The operators an app runs with, by name: createRegistry's, for one. */
      export interface ColumnRegistry {
        readonly operators: readonly { readonly name: string }[];
      }
    lang: ts
  - h3: From the packages under it
  - |
    What a view is made of from the page beside it (a column), from
    `@bh/template` (a host, a template) and from `@bh/resource` (a sort, a
    grouping, a filter, a value), as each defines it; [Columns](/views/columns),
    the [Templates](/templates/overview) guide and [The resource
    contract](/resources/contract) have them whole.
  - code: |
      /** A table's column: its fixed parts, and its cell, a template. */
      export interface Column {
        fixed: {
          /** Names it in the view and in its state; unique in its view. */
          key: string;
          /** What its header says. */
          label: string;
          /** And its width, align, pinned, sort, filter and hidden, on Columns. */
          [part: string]: Json;
        };
        template: TemplateNode;
      }

      /** A host as a view stores it: its fixed parts, and its template. */
      export interface Host<F> {
        fixed: F;
        template: TemplateNode;
      }

      /** A template: a layout node holding nodes, or a part, a thing a record shows. */
      export type TemplateNode = LayoutNode | Part;

      /** Nodes laid out by a registered layout: 'flex', 'grid', 'repeat', an app's. */
      export interface LayoutNode {
        layout: string;
        options?: Record<string, Json>;
        nodes: TemplateNode[];
        /** It shows only while the record passes it. */
        when?: Filter;
      }

      /** A field's value, a constant or a text, drawn by a registered renderer. */
      export type Part = ({ field: FieldPath } | { value: Json } | { text: string }) & {
        renderer?: string | { name: string; options: Record<string, Json> };
        format?: string | { name: string; options: Record<string, Json> };
        options?: Record<string, Json>;
        when?: Filter;
      };

      /** One key of an order. */
      export interface Sort {
        field: FieldPath;
        dir: 'asc' | 'desc';
      }

      /** What rows are grouped by: an option, ref or boolean field, an attribute. */
      export interface GroupBy {
        field: FieldPath;
        /** asc when absent. */
        dir?: 'asc' | 'desc';
        /** Also the groups no row is in. */
        all?: boolean;
      }

      /** Which rows: conditions on their fields, joined by all, any and not. */
      export type Filter =
        | { all: Filter[] }
        | { any: Filter[] }
        | { not: Filter }
        | { field: FieldPath; op: Operator; value?: Scalar | Scalar[] };

      /** A field's key, 'status', or an option field's attribute, 'status.kind'. */
      export type FieldPath = string;

      /** A registered operator's name: one of bh's fifteen or an app's own. */
      export type Operator = string;

      /** One value: text, a finite number, or a boolean. */
      export type Scalar = string | number | boolean;

      /** Any JSON value. */
      export type Json = null | Scalar | Json[] | { [key: string]: Json };
    lang: ts
