title: The client
summary: "A typed fetcher for a resource's routes, the error it throws, and what a list the client holds does with a row it just wrote, without asking the server again."
order: 2
related: [The resource contract, React Query hooks]
body:
  - |
    A typed fetcher for a resource's routes, the error it throws, and what a
    list the client holds does with a row it just wrote, without asking the
    server again.

    `@bh/resource/client` is an entry of its own beside the contract. Like
    the contract, it imports no React and no DOM: it calls the platform's
    `fetch`, so a browser and a server calling another app's API take the
    same client. [React Query hooks](/resources/hooks) builds on it; an app
    that keeps its own cache uses it alone. Every type this page names is
    defined under [Types](#types).
  - h2: Taking it
  - code: |
      import { resourceClient } from '@bh/resource/client';

      export const api = resourceClient({ base: '/api' });
    lang: ts
  - |
    `base` is where the routes sit: `/api` when absent, or another app's
    address, `https://tickets.example/api`. `fetch` replaces the global one,
    for a test or a fetch that signs its requests, and `headers` go on every
    request beside the client's own; a function is called for each request,
    so a token that changes is read when it's sent.
  - code: |
      import { resourceClient } from '@bh/resource/client';

      declare function currentToken(): Promise<string>;

      export const tickets = resourceClient({
        base: 'https://tickets.example/api',
        headers: async () => ({ authorization: `Bearer ${await currentToken()}` }),
      });
    lang: ts
  - h2: Reading and writing
  - |
    Each method is one route of [the contract](/resources/contract), by the
    resource's name, and answers its body, typed. `T` is the app's own type
    for a row, `Row` when absent; the server checks every row it answers
    against the metadata, so the client casts rather than parsing again.

    | Method                            | Route                             | Answers          |
    | --------------------------------- | --------------------------------- | ---------------- |
    | `meta(resource)`                  | `GET <base>/<resource>/meta`      | `ResourceMeta`   |
    | `query(resource, query?)`         | `POST <base>/<resource>/query`    | `QueryAnswer<T>` |
    | `read(resource, id)`              | `GET <base>/<resource>/:id`       | `T`              |
    | `create(resource, create)`        | `POST <base>/<resource>`          | `T`, after it    |
    | `update(resource, id, patch)`     | `PATCH <base>/<resource>/:id`     | `T`, after it    |
    | `delete(resource, id, {version})` | `DELETE <base>/<resource>/:id`    | nothing          |

    A delete sends its `version` in the URL, `?version=…`, as DELETE has no
    body. A read takes a `signal`, which aborts it. Every write sends an
    `Idempotency-Key`: a fresh uuid, or the one given, so a write sent again
    with the same key answers the first answer again rather than writing
    twice.
  - code: |
      import { resourceClient } from '@bh/resource/client';

      interface Item {
        id: number;
        title: string;
        status: string;
        updatedAt: string;
      }

      const api = resourceClient();

      const open = await api.query<Item>('items', {
        filter: { field: 'status.kind', op: 'in', value: ['todo', 'active'] },
        sort: [{ field: 'priority', dir: 'asc' }],
        page: { take: 50 },
      });

      const first = open.rows[0];
      if (first) {
        await api.update<Item>('items', first.id, {
          values: { status: 'done' },
          version: first.updatedAt,
        });
      }

      // The next page, after the cursor this one gave.
      if (open.page.next !== null) {
        await api.query<Item>('items', { page: { cursor: open.page.next, take: 50 } });
      }
    lang: ts
  - h2: Errors
  - |
    An error answer throws a `ResourceRequestError`: the status, and the
    `ErrorBody`'s `code`, `message` and `issues`. A client goes by `code`,
    never by the message. A body that isn't an `ErrorBody` (a proxy's 502, a
    page of HTML) gets its code from the status: 400 `invalid`, 404
    `not_found`, 409 `conflict`, anything else `internal`. A network failure
    throws as `fetch` does.
  - code: |
      import { resourceClient, ResourceRequestError } from '@bh/resource/client';

      const api = resourceClient();

      try {
        await api.update('items', 7, { values: { title: '' }, version: '2026-10-14T00:53:56.753Z' });
      } catch (error) {
        if (error instanceof ResourceRequestError && error.code === 'conflict') {
          // The row changed since it was read: show the newer one.
        } else if (error instanceof ResourceRequestError && error.code === 'invalid') {
          // error.issues: [{ path: ['values', 'title'], message: '…' }]
        } else {
          throw error;
        }
      }
    lang: ts
  - |
    An app's own codes type in as `ErrorBody`'s do:
    `ResourceRequestError<ErrorCode | 'unauthorized'>`.
  - h2: After a write
  - |
    A write answers the whole row as it is after it. A list the client holds
    (one query's page, or the pages a cursor brought) then keeps the row or
    drops it, and puts a kept one in its place, without asking the server
    again:

    - It keeps the row when the query's filter and search both do
      (`keepsRow`): the filter by `matchesFilter`, each operator's `matches`,
      `isMe` by who is viewing; the search by `matchesSearch`, the term in a
      searched field, case ignored.
    - It puts a kept row before the first held row it comes before, in the
      query's order (`rowOrder`): its sort, or the resource's, then the id.
    - A row past the last held row goes last only when no page follows
      (`page.more` is false); before the first, first only when no rows come
      before (a numbered page past the first, a page after a cursor).
      Otherwise it belongs on a page the client doesn't hold, which brings it
      when it loads.
    - A numbered page that grows past its `take` passes its last row on to
      the next page, and then has one.
    - The total moves by what entered or left: whether the query kept the row
      before (`previous`, the row as the client last saw it; null after a
      create) and keeps it now. When the client doesn't know the row before,
      the list kept it only if it held it.
    - The row carries only the fields the query asked for, and those its
      roles name.

    Where the client can't tell, each answers undefined and the caller asks
    the server again: a grouped answer, whose counts it doesn't keep; a sort
    by a key its kind can't order here (one without `compare`), by a ref
    whose titles it doesn't all know, or by a key the held rows don't carry.
  - code: |
      import { createRegistry, type QueryResult, type ResourceMeta, type Row } from '@bh/resource';
      import { answerAfterWrite, resourceClient } from '@bh/resource/client';

      const api = resourceClient();
      const registry = createRegistry();

      declare const meta: ResourceMeta;
      declare const before: Row;
      declare let held: QueryResult;

      const query = { filter: { field: 'status', op: 'equals', value: 'todo' } };
      held = await api.query('items', query);

      const after = await api.update('items', 7, { values: { status: 'done' } });
      const placed = answerAfterWrite(held, after, before, { query, meta, registry, viewer: 3 });
      held = placed ?? (await api.query('items', query));
    lang: ts
  - |
    `pagesAfterWrite` does the same over the pages a cursor brought, one after
    another from the first, and moves every page's total. `answerAfterDelete`
    and `pagesAfterDelete` take a deleted row out. `placeRow` and `removeRow`
    are what all four run on: pages of rows in, pages of rows and what entered
    or left out.
  - h2: The order
  - |
    `rowOrder(sort, meta, registry, { titleOf })`, from `@bh/resource`, is
    the contract's order as a comparator of rows, the one the server sorts
    by: each key by its kind's `compare` (text alphabetically, case ignored;
    an option by its `order`; numbers, dates and times by value), an
    attribute's path by its attribute's, and a ref by the title of the row it
    points at. Rows without a value come last both ways, and the id breaks
    ties, a number by value and text by code point, as every adapter does.

    A ref's title is the client's to know: `titleOf(resource, id)` answers it,
    from the rows of the resource the field's `of` names that it holds;
    undefined when it doesn't hold that row, which then orders as one without
    a value. Without `titleOf`, a sort by a ref answers undefined, as does a
    sort by a key whose kind has no `compare`.
  - code: |
      import { createRegistry, rowOrder, type ResourceMeta, type Row } from '@bh/resource';

      declare const meta: ResourceMeta;
      declare const rows: Row[];
      declare const users: Map<number, string>;

      const order = rowOrder([{ field: 'assignee', dir: 'asc' }], meta, createRegistry(), {
        titleOf: (resource, id) => (resource === 'users' ? users.get(Number(id)) : undefined),
      });
      if (order) {
        rows.sort(order);
      }
    lang: ts
  - h2: Types
  - |
    Every type above, as the package exports it. The contract's own shapes
    are under [From the contract](#from-the-contract); the parts those name in
    turn are on [the contract's page](/resources/contract#types).
  - h3: The fetcher
  - code: |
      import type { Create, Id, Patch, Query, QueryResult, ResourceMeta, Row } from '@bh/resource';

      /** A client for the contract's routes under `base`. */
      export declare function resourceClient(options?: ResourceClientOptions): ResourceClient;

      /** A fresh Idempotency-Key: a uuid. A write repeated with the same one answers the first answer again. */
      export declare function idempotencyKey(): string;

      /** What the client is built with. */
      export interface ResourceClientOptions {
        /** Where the routes sit: '/api' when absent, or 'https://tickets.example/api'. */
        base?: string;
        /** The fetch it calls; the global fetch when absent. */
        fetch?: typeof globalThis.fetch;
        /** Headers every request carries besides its own, or a function that answers them per request. */
        headers?: HeaderValues | (() => HeaderValues | Promise<HeaderValues>);
      }

      /** What `new Headers()` takes: an object of names, a list of pairs, or Headers. */
      export type HeaderValues = ConstructorParameters<typeof Headers>[0];

      /** What one call takes besides its resource and body. */
      export interface CallOptions {
        /** Aborts the request. */
        signal?: AbortSignal;
      }

      /** What one write takes besides its resource and body. */
      export interface WriteOptions extends CallOptions {
        /** Its Idempotency-Key: a fresh uuid when absent. */
        idempotencyKey?: string;
      }

      /** What a delete takes: the row's version as the client read it, sent in the URL. */
      export interface DeleteOptions extends WriteOptions {
        version?: string;
      }

      /** A query's answer with its rows typed as the app reads them. */
      export interface QueryAnswer<T = Row> extends Omit<QueryResult, 'rows'> {
        rows: T[];
      }

      /** The contract's routes, typed by its shapes; `T` is the app's type for a row. */
      export interface ResourceClient {
        meta(resource: string, options?: CallOptions): Promise<ResourceMeta>;
        query<T = Row>(resource: string, query?: Query, options?: CallOptions): Promise<QueryAnswer<T>>;
        read<T = Row>(resource: string, id: Id, options?: CallOptions): Promise<T>;
        create<T = Row>(resource: string, create: Create, options?: WriteOptions): Promise<T>;
        update<T = Row>(resource: string, id: Id, patch: Patch, options?: WriteOptions): Promise<T>;
        delete(resource: string, id: Id, options?: DeleteOptions): Promise<void>;
      }
    lang: ts
  - h3: The error
  - code: |
      import type { ErrorBody, ErrorCode, Issue } from '@bh/resource';

      /** A route's error answer: its status, and its ErrorBody's code, message and issues. */
      export declare class ResourceRequestError<Code extends string = ErrorCode> extends Error {
        /** 400, 404, 409, 500… */
        readonly status: number;
        /** 'invalid', 'not_found', 'conflict', 'internal', or an app's own. */
        readonly code: Code;
        /** An invalid answer's problems, each at its path; [] for any other. */
        readonly issues: Issue[];
        constructor(status: number, error: ErrorBody<Code>['error']);
        /** The error a failed answer carries; a code from its status when its body isn't an ErrorBody. */
        static from<Code extends string = ErrorCode>(
          status: number,
          statusText: string,
          body: unknown,
        ): ResourceRequestError<Code>;
      }
    lang: ts
  - h3: Held lists
  - code: |
      import type { Id, Query, QueryResult, Registry, ResourceMeta, Row, Scalar, TitleOf } from '@bh/resource';

      /** What placing a row in a query's answer needs beyond the rows. */
      export interface HeldContext {
        /** The query the list answers. */
        query: Query;
        meta: ResourceMeta;
        /** bh's kinds and operators and the app's own, as the server runs with. */
        registry: Registry;
        /** The signed-in user's id, for isMe. */
        viewer?: Scalar;
        /** The titles a ref orders by. */
        titleOf?: TitleOf;
      }

      /** Where the pages held sit among every row the query keeps. */
      export interface HeldEdges {
        /** Rows come before the first page held. */
        before: boolean;
        /** Rows follow the last page held: its page.more. */
        after: boolean;
      }

      /** The row as the client last saw it; null after a create; undefined when it doesn't know. */
      export type Previous = Row | null | undefined;

      /** Whether the query keeps the row: its filter and its search both hold. */
      export declare function keepsRow(row: Row, context: HeldContext): boolean;

      /** A held answer after a write; undefined when the client can't tell. */
      export declare function answerAfterWrite(
        answer: QueryResult,
        row: Row,
        previous: Previous,
        context: HeldContext,
      ): QueryResult | undefined;

      /** A held answer after a delete; undefined for a grouped one. */
      export declare function answerAfterDelete(
        answer: QueryResult,
        id: Id,
        previous: Previous,
        context: HeldContext,
      ): QueryResult | undefined;

      /** The pages a cursor brought, after a write; undefined when the client can't tell. */
      export declare function pagesAfterWrite(
        answers: readonly QueryResult[],
        row: Row,
        previous: Previous,
        context: HeldContext,
      ): QueryResult[] | undefined;

      /** The pages a cursor brought, after a delete. */
      export declare function pagesAfterDelete(
        answers: readonly QueryResult[],
        id: Id,
        previous: Previous,
        context: HeldContext,
      ): QueryResult[] | undefined;

      /** Pages of rows after a write, and whether the row entered (1), left (-1) or neither. */
      export declare function placeRow(
        pages: readonly (readonly Row[])[],
        row: Row,
        previous: Previous,
        edges: HeldEdges,
        context: HeldContext,
      ): { pages: Row[][]; entered: -1 | 0 | 1 } | undefined;

      /** Pages of rows after a delete, and whether the query kept the row (-1). */
      export declare function removeRow(
        pages: readonly (readonly Row[])[],
        id: Id,
        previous: Previous,
        context: HeldContext,
      ): { pages: Row[][]; entered: -1 | 0 };
    lang: ts
  - h3: The order and the search
  - code: |
      import type { Id, Registry, ResourceMeta, Row, Sort } from '@bh/resource';

      /** A ref's title, by the resource its field names and the row's id; undefined when not known. */
      export type TitleOf = (resource: string, id: Id) => string | undefined;

      /** What rowOrder needs beyond the sort, the metadata and the registry. */
      export interface OrderOptions {
        /** The titles a ref orders by; without it a sort by a ref answers undefined. */
        titleOf?: TitleOf;
      }

      /** The contract's order of `sort`, then the id; undefined when a key can't be ordered here. */
      export declare function rowOrder(
        sort: readonly Sort[],
        meta: ResourceMeta,
        registry: Registry,
        options?: OrderOptions,
      ): ((a: Row, b: Row) => number) | undefined;

      /** Whether a query's search keeps the row: a searched field holds the term, case ignored. */
      export declare function matchesSearch(
        term: string,
        row: Row,
        meta: ResourceMeta,
        registry: Registry,
      ): boolean;
    lang: ts
  - h3: From the contract
  - code: |
      import type {
        ActionMeta,
        FieldMeta,
        Filter,
        GroupBy,
        KindSpec,
        OperatorSpec,
        FormatSpec,
        Page,
        ResourceRoles,
        Serves,
        Sort,
      } from '@bh/resource';

      /** One value: text, a finite number, or a boolean. */
      export type Scalar = string | number | boolean;

      /** Any JSON value. */
      export type Json = null | Scalar | Json[] | { [key: string]: Json };

      /** A row's id: a string that isn't empty, or a whole number. */
      export type Id = string | number;

      /** A field's value: its kind's, null when unset; a list of them on a list field. */
      export type FieldValue = null | Scalar | Scalar[] | Json;

      /** A row: its fields' values by key. */
      export type Row = Record<string, FieldValue>;

      /** GET /meta: what a resource's rows are, and what it serves. */
      export interface ResourceMeta {
        resource: string;
        label: { one: string; other: string };
        /** Which field is each row's id, title, picture and version. */
        roles: ResourceRoles;
        fields: FieldMeta[];
        /** The order of a query that names none. */
        sort: Sort[];
        actions: ActionMeta[];
        /** Its writes, how a filter joins, how it pages. */
        serves: Serves;
      }

      /** POST /query: the body. */
      export interface Query {
        filter?: Filter;
        search?: string;
        sort?: Sort[];
        page?: Page;
        group?: GroupBy;
        fields?: string[];
      }

      /** POST /query: the answer. */
      export interface QueryResult {
        /** [] when the query grouped. */
        rows: Row[];
        groups?: { key: Scalar | null; count: number; filter: Filter }[];
        page: {
          /** The next page's cursor; null on the last. */
          next: string | null;
          /** Whether a page follows this one. */
          more: boolean;
          /** Every row the filter and search keep; null where the source doesn't count. */
          total: number | null;
        };
      }

      /** POST's body. */
      export interface Create {
        values: Record<string, FieldValue>;
      }

      /** PATCH's body: the values that change, and the version read. */
      export interface Patch {
        values: Record<string, FieldValue>;
        version?: string;
      }

      /** Every error's body. */
      export interface ErrorBody<Code extends string = ErrorCode> {
        error: { code: Code; message: string; issues?: Issue[] };
      }

      /** The codes bh's routes answer: 400, 404, 409 and 500. */
      export type ErrorCode = 'invalid' | 'not_found' | 'conflict' | 'internal';

      /** One problem with an invalid request, at its path in the body. */
      export interface Issue {
        path: (string | number)[];
        message: string;
      }

      /** What an app runs with: bh's kinds and operators, its own, and the formats. */
      export interface Registry {
        readonly kinds: readonly KindSpec[];
        readonly formats: readonly FormatSpec[];
        readonly operators: readonly OperatorSpec[];
      }
    lang: ts
