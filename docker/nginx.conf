# Single public port (:4610) serves everything by path — fully self-hosted/offline:
#   /        -> web SPA
#   /api/    -> internal node API (REST + the AI session WebSocket)
#   /studio  -> pgweb (self-hosted Postgres browser, served under its --prefix)

# WebSocket upgrade demux: "upgrade" only when the client asked for it, else
# "close" — so plain REST requests keep normal keep-alive and only the
# /api/ai/sessions/:id/socket handshake is upgraded. Included at http level
# (this file lands in /etc/nginx/http.d/default.conf).
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API — internal node process (not published). Carries both REST and the AI
  # session WebSocket, so it needs HTTP/1.1 + the upgrade headers; without them
  # the socket upgrade is proxied as a plain GET and never opens. proxy_buffering
  # off keeps streamed terminal output from being held back in an nginx buffer.
  location /api/ {
    proxy_pass http://127.0.0.1:4600;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
  }

  # pgweb DB browser (runs with --prefix studio on 127.0.0.1:4983)
  location /studio {
    proxy_pass http://127.0.0.1:4983;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # SPA fallback — TanStack Router owns the paths
  location / {
    try_files $uri /index.html;
  }
}
