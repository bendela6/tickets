# Single public port (:4610) serves everything by path — fully self-hosted/offline:
#   /             -> web SPA
#   /api/         -> internal node API (REST)
#   /signals-api/ -> internal signals collector (also published directly on :4640)
#   /studio       -> pgweb (self-hosted Postgres browser, served under its --prefix)

# WebSocket upgrade demux: "upgrade" only when the client asked for it, else
# "close" — so plain requests keep normal keep-alive. Included at http level
# (this file lands in /etc/nginx/http.d/default.conf).
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API — internal node process (not published).
  location /api/ {
    proxy_pass http://127.0.0.1:4600;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Signals collector — internal node process, also published directly on
  # :4640 (external apps' SDKs send signals + fetch /sdk.js there). The
  # trailing slash on proxy_pass strips the /signals-api prefix, mirroring
  # the vite dev-server proxy rewrite.
  location /signals-api/ {
    proxy_pass http://127.0.0.1:4640/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
  }

  # pgweb DB browser (runs with --prefix studio on 127.0.0.1:4983)
  location /studio {
    proxy_pass http://127.0.0.1:4983;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # SPA fallback — TanStack Router owns the paths
  location / {
    try_files $uri /index.html;
  }
}
