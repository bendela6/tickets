# App vhost — web SPA + internal API. Only this is on the main port (:4610).
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API — internal node process (not published)
  location /api/ {
    proxy_pass http://127.0.0.1:4600;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # SPA fallback — TanStack Router owns the paths
  location / {
    try_files $uri /index.html;
  }
}

# Drizzle Studio vhost on its OWN port (published as 127.0.0.1:4984), mirroring
# medialib's dedicated drizzle.{$DOMAIN} origin. A dedicated origin is required
# because drizzle's UI POSTs its data protocol to the origin ROOT — on the app's
# origin that root is the SPA. Here root is free for the protocol.
#   GET  /         -> bootstrap: redirect to the shell, telling it this origin
#   /studio/*      -> the hosted UI shell (relative assets proxy through here)
#   everything else-> the local drizzle-kit studio server (127.0.0.1:4983)
server {
  listen 4984;

  location /studio/ {
    proxy_pass https://local.drizzle.studio/;
    proxy_set_header Host local.drizzle.studio;
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_set_header Accept-Encoding "";
  }

  location = / {
    if ($request_method = GET) { return 302 /studio/?host=$host&port=4984; }
    proxy_pass http://127.0.0.1:4983;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location / {
    proxy_pass http://127.0.0.1:4983;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }
}
