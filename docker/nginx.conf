server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API — internal node process (not published)
  location /api/ {
    proxy_pass http://127.0.0.1:4600;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Drizzle Studio is NOT proxied here: a same-origin /studio proxy can't work
  # with a SPA at "/" over plain http (drizzle's UI shell loads from
  # local.drizzle.studio but its data calls to the origin root would hit the
  # SPA, and mixed-content blocks http). Studio is reached another way in the
  # deployed stack — see docker-compose.yml / the plan's Task 7.

  # SPA fallback — TanStack Router owns the paths
  location / {
    try_files $uri /index.html;
  }
}
