# Single public port (:4610) serves everything by path:
#   /        -> web SPA           (GET)
#   /api/    -> internal node API
#   /studio  -> Drizzle Studio    (UI shell + data protocol, same origin)
#
# Studio's hosted UI POSTs its data protocol to the ORIGIN ROOT (it has no
# base-path option), so it can't sit under a normal sub-path. We share the
# origin by ROUTING ON METHOD at "/": GET / is the SPA; POST / is the studio
# protocol. This is safe because the web app only ever POSTs under /api/ — it
# never POSTs to "/". If that ever changes, studio would need its own origin
# (a dedicated port) again.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API — internal node process (not published)
  location /api/ {
    proxy_pass http://127.0.0.1:4600;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Drizzle Studio, same origin under /studio
  location = /studio { return 302 /studio/?host=$host&port=4610; }
  location /studio/ {
    proxy_pass https://local.drizzle.studio/;   # UI shell (relative assets proxy through here)
    proxy_set_header Host local.drizzle.studio;
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_set_header Accept-Encoding "";
  }

  # root: GET = SPA index; POST = studio data protocol -> internal studio server
  location = / {
    if ($request_method = POST) { proxy_pass http://127.0.0.1:4983; }
    try_files /index.html =404;
  }

  # SPA fallback — TanStack Router owns the paths
  location / {
    try_files $uri /index.html;
  }
}
