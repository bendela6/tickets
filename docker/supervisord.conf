[supervisord]
nodaemon=true
user=root

[program:api]
command=pnpm --filter @tickets/api start
directory=/app
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:signals]
# db:create + db:migrate now run in entrypoint.sh, before supervisord starts
# — see the comment there. This program just binds the HTTP server.
command=pnpm --filter @tickets/signals start
directory=/app
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:pgweb]
command=/usr/bin/pgweb --bind 127.0.0.1 --listen 4983 --prefix studio --lock-session --url postgres://%(ENV_POSTGRES_USER)s:%(ENV_POSTGRES_PASSWORD)s@%(ENV_POSTGRES_HOST)s:%(ENV_POSTGRES_PORT)s/%(ENV_POSTGRES_DATABASE)s?sslmode=disable
directory=/app
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g 'daemon off;'
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
