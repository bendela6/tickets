services:
  postgres:
    image: postgres:17-alpine
    # Come back after a crash or a host reboot. `unless-stopped` (not `always`)
    # so a deliberate `docker stop` stays stopped.
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tickets
    ports:
      - '127.0.0.1:5532:5432'
    volumes:
      - tickets-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d tickets']
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    restart: unless-stopped
    build:
      context: .
      target: app
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: tickets
      API_HOST: 127.0.0.1
      API_PORT: 4600
    ports:
      # Loopback-bound, like postgres above. `/api` is unauthenticated and now
      # includes /api/schema/databases + /api/schema?database=, which enumerate
      # every connectable database on this server and dump any of their
      # catalogs — so publishing it on every interface would hand the LAN a
      # cluster-wide schema disclosure. Reach it from another host over an SSH
      # tunnel, not by widening this.
      - '127.0.0.1:4610:80' # everything by path: / (web) · /api · /studio
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  tickets-pgdata:
