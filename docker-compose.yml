services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tickets
    ports:
      - '127.0.0.1:5532:5432'
    volumes:
      - tickets-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d tickets']
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      target: app
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: tickets
      API_HOST: 127.0.0.1
      API_PORT: 4600
      SIGNALS_HOST: 0.0.0.0
      SIGNALS_PORT: 4640
      SIGNALS_DATABASE: signals
    ports:
      - '4610:80'   # everything by path: / (web) · /api · /studio
      - '4640:4640' # signals collector, published directly for external SDKs
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  tickets-pgdata:
