services:
  postgres:
    image: postgres:17-alpine
    # Come back after a crash or a host reboot. `unless-stopped` (not `always`)
    # so a deliberate `docker stop` stays stopped.
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tickets
    ports:
      - '127.0.0.1:5532:5432'
    volumes:
      - tickets-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d tickets']
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    restart: unless-stopped
    build:
      context: .
      target: app
      args:
        # Set by scripts/deploy-web.sh (git short SHA). Baked into the web
        # bundle as VITE_SIGNALS_RELEASE and reused to tag the source maps it
        # uploads, so reported frames and stored maps agree on one release.
        SIGNALS_RELEASE: ${SIGNALS_RELEASE:-}
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: tickets
      API_HOST: 127.0.0.1
      API_PORT: 4600
      # Directory-browser allow-list (/api/workdirs/dirs): container's workspace root
      WORKDIR_ROOTS: /workspaces
      SIGNALS_HOST: 0.0.0.0
      SIGNALS_PORT: 4640
      SIGNALS_DATABASE: signals
    ports:
      # Loopback-bound, like postgres above. `/api` is unauthenticated and now
      # includes /api/schema/databases + /api/schema?database=, which enumerate
      # every connectable database on this server and dump any of their
      # catalogs — so publishing it on every interface would hand the LAN a
      # cluster-wide schema disclosure. Reach it from another host over an SSH
      # tunnel, not by widening this.
      - '127.0.0.1:4610:80' # everything by path: / (web) · /api · /studio
      - '4640:4640'         # signals collector, published directly for external SDKs
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  tickets-pgdata:
