<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="border:1px solid var(--bd);border-radius:14px;background:var(--rs);padding:32px 28px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;box-shadow:var(--shsm)">
  <div style="width:44px;height:44px;border-radius:11px;background:var(--acs);color:var(--ac);display:inline-flex;align-items:center;justify-content:center;font:400 20px 'IBM Plex Mono',monospace">⇄</div>
  <div style="font:600 17px 'IBM Plex Sans',sans-serif;color:var(--f1)">No automations yet</div>
  <div style="font:400 13px/1.6 'IBM Plex Sans',sans-serif;color:var(--f2);max-width:380px;text-wrap:pretty">Rules watch ticket events and act for you — no code. For example: <span style="color:var(--f1)">when a Bug moves to Done, post a comment and ping a webhook.</span></div>
  <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:center;margin:4px 0 6px">
    <span style="height:24px;padding:0 10px 0 8px;border-radius:6px;background:var(--acs);color:var(--ac);font:500 12px 'IBM Plex Sans',sans-serif;display:inline-flex;align-items:center;gap:6px"><span style="font:400 11px 'IBM Plex Mono',monospace">⇄</span>Status changed</span>
    <span style="color:var(--f3);font-size:12px">·</span>
    <span style="height:22px;padding:0 8px;border-radius:5px;background:var(--in);font:500 12px 'IBM Plex Sans',sans-serif;color:var(--f2);display:inline-flex;align-items:center">Type is Bug</span>
    <span style="color:var(--f3);font-size:12px">→</span>
    <span style="height:22px;padding:0 8px;border-radius:5px;background:var(--in);font:500 12px 'IBM Plex Sans',sans-serif;color:var(--f1);display:inline-flex;align-items:center">＋ Comment</span>
  </div>
  <button style="height:34px;padding:0 14px;border-radius:8px;border:none;background:var(--ac);color:var(--oac);font:500 13px 'IBM Plex Sans',sans-serif;cursor:pointer">Create your first rule</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:560,&quot;height&quot;:320}}"></script>
</body>
</html>
