<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EER model viewer</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230b0d12'/%3E%3Crect x='3' y='3' width='4.5' height='4.5' rx='1' fill='%23f5c542'/%3E%3Crect x='8.5' y='8.5' width='4.5' height='4.5' rx='1' fill='%233ecf8e'/%3E%3Cpath d='M5.25 7.5v1.75H8.5' stroke='%237aa2ff' fill='none'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="eer-viewer/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div class="brand">
          <h1 id="brand-title">EER model viewer</h1>
          <p id="brand-sub">loading…</p>
        </div>

        <div class="controls">
          <div class="search">
            <input id="search" type="text" placeholder="Search entities / fields…" autocomplete="off" spellcheck="false" />
            <div id="search-results" class="search-results"></div>
          </div>
          <div id="group-toggles" class="toggle-group"></div>
          <div id="kind-toggles" class="toggle-group"></div>
          <button id="routing-btn" class="btn" type="button">Routing: curved</button>
          <button id="fit-btn" class="btn" type="button" title="Fit the diagram to the viewport">Fit</button>
          <button id="rearrange-btn" class="btn" type="button" title="Re-pack entities by zone">Rearrange</button>
          <button id="check-btn" class="btn" type="button" title="Run the quality checks">Self-check</button>
        </div>
      </header>

      <main class="main">
        <div id="viewport" class="viewport">
          <div id="world" class="world"></div>

          <div id="banner" class="banner">
            <button id="banner-close" class="close" type="button" aria-label="Dismiss">×</button>
            <div id="banner-body"></div>
          </div>

          <div id="checks" class="checks">
            <h3>Self-check <button id="checks-close" class="close" type="button" aria-label="Close">×</button></h3>
            <div id="checks-body"></div>
          </div>
        </div>

        <aside id="detail" class="detail"></aside>
      </main>
    </div>

    <script type="module" src="eer-viewer/main.js"></script>
  </body>
</html>
