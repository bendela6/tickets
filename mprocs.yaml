# Dev process dashboard, launched by `pnpm dev`.
# keys: up/down select pane, `r` restart, `x` stop, `q` quit.
# All panes target the tickets_dev database on 127.0.0.1:5532 (see .env).
procs:
  api:
    shell: pnpm --filter @tickets/api dev
  web:
    shell: pnpm --filter @tickets/web dev
    env:
      WEB_DEV_PORT: "4620"
  signals:
    shell: pnpm --filter @tickets/signals dev
  # Client-only, so it needs no database and no api — but it shares
  # @tickets/ui, and a token change that breaks it should break it here rather
  # than the next time somebody opens it on purpose. Reach it at
  # http://localhost:4670, never 127.0.0.1:4670: Windows resolves localhost to
  # ::1 first and Vite binds only that.
  icon:
    shell: pnpm --filter @tickets/icon dev
  # Watches every Claude Code session on this machine, not just this repo, so it is
  # useful across projects — stop the pane with `x` if you don't want it running.
  board:
    shell: pnpm --filter @tickets/board dev
  studio:
    shell: pnpm db:studio
  watchers:
    shell: turbo watch typecheck
