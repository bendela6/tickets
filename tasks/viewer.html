      function childrenOf(x) {
        return x.features ?? x.tasks ?? x.subs ?? [];
      }
      /** The items that keep their own approval: those without children. */
      function leavesOf(x) {
        const c = childrenOf(x);
        return c.length ? c.flatMap(leavesOf) : [x];
      }
      /** Cancelled: by the user, or, with children, when all of them are. */
      function cancelledOf(x) {
        return leavesOf(x).every((leaf) => leaf.cancelled === true);
      }
      /** What's left to build under it (or it): neither done nor cancelled. Only these are approved or cancelled. */
      function openOf(x) {
        return leavesOf(x).filter((leaf) => !doneOf(leaf) && leaf.cancelled !== true);
      }
      /** Approved: by the user, or, with children, when all of them left to build are. */
      function approvedOf(x) {
        const open = openOf(x);
        return open.length > 0 && open.every((leaf) => leaf.approved === true);
      }
      /** "Approved", or "3/8 approved" while some are, of what's left to build; then how many approved ones wait, and how many are cancelled. */
      function approvalHtml(x) {
        const open = openOf(x);
        if (!open.length) return '';
        const all = leavesOf(x);
        const gone = all.filter((leaf) => leaf.cancelled === true).length;
        const cancelled =
          gone && all[0] !== x ? `<span class="approved-n">${gone} cancelled</span>` : '';
        const n = open.filter((leaf) => leaf.approved === true).length;
        const held = all[0] === x ? [] : heldOf(x);
        const heldChip = held.length
          ? `<span class="chip s-held" title="${escape(
              held
                .map(
                  (l) =>
                    `${l.id} waits on ${waitsOf(l)
                      .map((w) => w.id)
                      .join(', ')}`,
                )
                .join('\n'),
            )}">${held.length} approved, waiting</span>`
          : '';
        if (n === open.length)
          return `<span class="chip s-approved">Approved</span>${heldChip}${cancelled}`;
        return (
          (n ? `<span class="approved-n">${n}/${open.length} approved</span>` : '') +
          heldChip +
          cancelled
        );
      }
      /** The toggle: Approve (or Approve all, for an item with children) / Approved. None once nothing is left to build. */
      function approveButton(x, key) {
        const open = openOf(x);
        if (!open.length) return '';
        const on = approvedOf(x);
        const many = open.length > 1 || leavesOf(x)[0] !== x;
        const text = on ? 'Approved ✓' : many ? 'Approve all' : 'Approve';
        const waiting = open.filter((l) => waitsOf(l).length).length;
        const rest = open.length < leavesOf(x).length ? ' still to build' : '';
        const title = on
          ? 'Approved. Press to take the approval back.'
          : many
            ? `Approve all ${open.length} items${rest} under it.${waiting ? ` ${waiting} of them wait on other items and will be built after those.` : ''}`
            : `Approve it.${
                waiting
                  ? ` It waits on ${waitsOf(x)
                      .map((w) => w.id)
                      .join(
                        ', ',
                      )}, so it will be built after ${waitsOf(x).length > 1 ? 'those' : 'that'}.`
                  : ''
              }`;
        return `<button type="button" class="approve" data-act="approve" data-id="${escape(key ?? refOf(x))}" data-to="${!on}" aria-pressed="${on}" title="${escape(title)}">${text}</button>`;
      }
      /** Cancel (Cancel all, with children): it won't be built. None on a done item; a cancelled one offers Restore. */
      function cancelButton(x, key) {
        const id = escape(key ?? refOf(x));
        if (cancelledOf(x))
          return `<button type="button" class="link-button" data-act="cancel" data-id="${id}" data-to="false" title="Cancelled: it won't be built. Bring it back.">Restore</button>`;
        if (doneOf(x)) return '';
        const open = openOf(x);
        if (!open.length) return '';
        const many = open.length > 1 || leavesOf(x)[0] !== x;
        const waiting = (state.blocks.get(refOf(x)) ?? []).length;
        const title = `${many ? `Cancel all ${open.length} items still to build under it` : 'Cancel it'}: it won't be built.${waiting ? ` ${waiting} ${waiting === 1 ? 'item waits' : 'items wait'} on it.` : ''}`;
        return `<button type="button" class="act" data-act="cancel" data-id="${id}" data-to="true" title="${escape(title)}">${many ? 'Cancel all' : 'Cancel'}</button>`;
      }
      /** An item's buttons: Approve and Cancel while it's left to build, and Note. */
      function actionsHtml(x) {
        return `<span class="actions">${approveButton(x)}${cancelButton(x)}${chatButton(x)}</span>`;
      }
      function buttons(rows, attr, current) {
        return rows
          .map(
            ([key, label, n]) =>
              `<button type="button" class="filter" data-${attr}="${escape(key)}" aria-pressed="${(current ?? 'all') === key}">${label} <span class="n">${n}</span></button>`,
          )
          .join('');
      }

      function renderList() {
        const docs = state.docs.filter((d) => !state.project || d.prefix === state.project);
        const all = docs.flatMap((d) => d.features);
        const tasks = all.flatMap((f) => f.tasks);
        const subs = tasks.flatMap((t) => t.subs);
        document.getElementById('totals').textContent = [
          `${docs.length} ${docs.length === 1 ? 'project' : 'projects'}`,
          `${docs.reduce((n, d) => n + d.epics.length, 0)} epics`,
          `${all.length} features`,
          `${tasks.length} tickets`,
          subs.length ? `${subs.length} subtickets` : '',
          `${tasks.filter((t) => t.done).length + subs.filter((s) => s.done).length} done`,
          `${docs.flatMap(openOf).filter((leaf) => leaf.approved === true).length} of ${docs.flatMap(openOf).length} left to build approved`,
          docs.flatMap(heldOf).length ? `${docs.flatMap(heldOf).length} approved but waiting` : '',
          all.reduce((n, f) => n + askedOf(f), 0)
            ? `${all.reduce((n, f) => n + askedOf(f), 0)} questions for you`
            : '',
        ]
          .filter(Boolean)
          .join(' · ');

        document.getElementById('projects').innerHTML = buttons(
          [
            ['all', 'All projects', state.docs.reduce((n, d) => n + d.features.length, 0)],
            ...state.docs.map((d) => [
              d.prefix,
              `${escape(d.repo)} <span class="n">${d.prefix}</span>`,
              d.features.length,
            ]),
          ],
          'project',
          state.project,
        );

        // Waiting: on your words (waitingOn), or it or one of its open tickets waits on an item.
        const waiting = (f) =>
          f.waitingOn ||
          (!doneOf(f) && [f, ...leavesOf(f)].some((x) => !doneOf(x) && waitsOf(x).length));
        const counts = {};
        for (const f of all) {
          counts[kindOf(f)] = (counts[kindOf(f)] ?? 0) + 1;
          if (waiting(f)) counts.waiting = (counts.waiting ?? 0) + 1;
          if (heldOf(f).length) counts.held = (counts.held ?? 0) + 1;
          const approval = cancelledOf(f)
            ? 'cancelled'
            : !openOf(f).length
              ? null
              : approvedOf(f)
                ? 'approved'
                : 'unapproved';
          if (askedOf(f)) counts.ask = (counts.ask ?? 0) + 1;
          if (approval) counts[approval] = (counts[approval] ?? 0) + 1;
        }
        document.getElementById('filters').innerHTML = buttons(
          [
            ['all', 'All', all.length],
            ...KINDS.map(([k, label]) => [k, label, counts[k] ?? 0]),
            ['waiting', 'Waiting', counts.waiting ?? 0],
            ['approved', 'Approved', counts.approved ?? 0],
            ['held', 'Approved, waiting', counts.held ?? 0],
            ['unapproved', 'To approve', counts.unapproved ?? 0],
            ['ask', 'Questions for you', counts.ask ?? 0],
            ['cancelled', 'Cancelled', counts.cancelled ?? 0],
          ].filter(([k, , n]) => k === 'all' || n > 0),
          'filter',
          state.filter,
        );
        const named = [...new Set(all.flatMap(reposOf))];
        const repos = [
          ...KNOWN_REPOS.filter((r) => named.includes(r)),
          ...named.filter((r) => !KNOWN_REPOS.includes(r)),
        ];
        document.getElementById('places').innerHTML = buttons(
          [
            ['all', 'Everywhere', all.length],
            ...repos.map((r) => [
              r,
              `<span class="repo ${repoClass(r)}">${escape(r)}</span>`,
              all.filter((f) => reposOf(f).includes(r)).length,
            ]),
          ],
          'place',
          state.place,
        );

        const find = state.find.trim().toLowerCase();
        const textOf = (t) => [
          t.id,
          t.title,
          t.description,
          whereText(t.where),
          ...t.subs.flatMap(textOf),
        ];
        const shown = (f) => {
          if (
            state.filter &&
            !(
              state.filter === kindOf(f) ||
              (state.filter === 'waiting' && waiting(f)) ||
              (state.filter === 'held' && heldOf(f).length) ||
              (state.filter === 'approved' && approvedOf(f)) ||
              (state.filter === 'unapproved' && openOf(f).length && !approvedOf(f)) ||
              (state.filter === 'ask' && askedOf(f)) ||
              (state.filter === 'cancelled' && cancelledOf(f))
            )
          )
            return false;
          if (state.place && !reposOf(f).includes(state.place)) return false;
          if (!find) return true;
          const hay = [
            f.id,
            f.title,
            f.description,
            f.status,
            f.statusNote,
            whereText(f.where),
            f.epic.id,
            f.epic.title,
            f.doc.repo,
            ...SECTIONS.map(([key]) => (f[key] ? blockText(f[key]) : '')),
            f.chosen ? blockText(f.chosen) : '',
            ...f.tasks.flatMap(textOf),
          ]
            .join(' ')
            .toLowerCase();
          return hay.includes(find);
        };
        const html = docs
          .map((doc) => {
            const epics = doc.epics
              .map((epic) => {
                const features = epic.features.filter(shown);
                if (!features.length) return '';
                const anchor = `${doc.prefix}/${epic.id}`;
                return `<section class="group" id="${anchor}"><header class="epic-head"><a class="eid" href="#${anchor}">${epic.id}</a><h2>${inline(epic.title)}</h2><span class="n">${features.length} of ${epic.features.length} features</span>${progressHtml(
                  epic.features.flatMap((f) => f.tasks),
                  false,
                )}${approveButton(epic, anchor)}</header>${epic.description ? `<p class="epic-desc">${inline(epic.description)}</p>` : ''}<ul class="rows card">${features
                  .map(
                    (f) => `<li><a class="row" href="#${f.id}">
              <span class="id">${f.id}</span>
              <span><span class="title">${inline(f.title, true)}</span><span class="desc">${inline(lead(f.description), true)}</span><span class="repos">${reposOf(
                f,
              )
                .map((r) => `<span class="repo ${repoClass(r)}">${escape(r)}</span>`)
                .join('')}</span></span>
              <span class="side">${chipsHtml(f)}${workChip(f.id, true)}${askChip(f)}${waitsChip(f, false)}${progressHtml(f.tasks, false)}${approvalHtml(f)}</span>
            </a></li>`,
                  )
                  .join('')}</ul></section>`;
              })
              .join('');
            if (!epics) return '';
            const shownIntro = !find && !state.filter && !state.place;
            return `<section class="project" id="${doc.prefix}"><header class="project-head"><h2>${escape(doc.repo)}</h2><a class="prefix" href="#${doc.prefix}">${doc.prefix} · ${doc.file}</a><span class="n">${doc.features.length} features</span>${approvalHtml(
              doc,
            )}${progressHtml(
              doc.features.flatMap((f) => f.tasks),
              false,
            )}</header>${shownIntro && doc.intro?.length ? `<div class="intro">${doc.intro.map(block).join('')}</div>` : ''}${epics}</section>`;
          })
          .join('');
        document.getElementById('groups').innerHTML =
          html || '<div class="group card empty">No feature matches.</div>';
      }

      function renderDetail(id) {
        const target = state.byId.get(id);
        const f = target?.feature ?? target;
        const view = document.getElementById('detail-view');
        if (!f) {
          document.title = `${id} · Tasks`;
          view.innerHTML = `<div class="nav"><a href="#">← All tasks</a></div><div class="head"><h1>No ${escape(id)}</h1><p class="desc">No feature or ticket in tasks/ has this id.</p></div>`;
          return;
        }
        const doc = f.doc;
        const at = doc.features.indexOf(f);
        const prev = doc.features[at - 1];
        const next = doc.features[at + 1];
        document.title = `${f.id} ${f.title.replace(/`/g, '')} · Tasks`;
        const where = (t) =>
          t.where
            ? `<p class="where"><span class="where-label">Where</span>${whereHtml(t.where)}</p>`
            : '';
        const yours = (t) => (t.byYou ? '<span class="yours">yours</span>' : '');
        // The feature's own waits show in its header; a ticket's chip names only the rest.
        const above = waitsOf(f).map((w) => w.id);
        // Each ticket a card, its subtickets cards inside it: a head (tick, id, title, chips, buttons)
        // and a body (description, where, what it waits on and blocks, notes, subtickets).
        const head = (t, extra = '') => `<div class="thead">
      <span class="box" role="img" aria-label="${cancelledOf(t) ? 'Cancelled' : t.done ? 'Done' : 'Not done'}">${cancelledOf(t) ? CROSS : CHECK}</span>
      <a class="id" href="#${t.id}">${t.id}</a>
      <span class="title"><span class="tt">${inline(t.title)}</span>${yours(t)}${extra}${workChip(t.id)}${cancelledOf(t) ? '<span class="chip s-cancelled">Cancelled</span>' : ''}${waitsChip(t, true, above)}</span>
      ${actionsHtml(t)}
    </div>`;
        const body = (t, inner = '') =>
          `<div class="tbody">${t.description ? `<div class="desc" data-quote-for="${escape(t.id)}">${rich(t.description)}</div>` : ''}${where(t)}${depsHtml(t)}${inner}</div>`;
        const classes = (t, kind) =>
          [
            kind,
            t.done && !cancelledOf(t) && 'is-done',
            cancelledOf(t) && 'is-cancelled',
            t.id === id && 'is-target',
          ]
            .filter(Boolean)
            .join(' ');
        const sub = (s) =>
          `<li class="${classes(s, 'sub')}" id="${s.id}">${head(s)}${body(s)}</li>`;
        const step = (t) =>
          `<li class="${classes(t, 'step card')}" id="${t.id}">${head(
            t,
            t.subs.some((s) => !cancelledOf(s))
              ? `<span class="subcount">${t.subs.filter((s) => s.done && !cancelledOf(s)).length}/${t.subs.filter((s) => !cancelledOf(s)).length}</span>`
              : '',
          )}${body(t, t.subs.length ? `<ol class="subs">${t.subs.map(sub).join('')}</ol>` : '')}</li>`;
        const section = ([key, label]) =>
          f[key]
            ? `<section class="section"><h2 class="label">${label}</h2><div class="card">${block(f[key])}</div></section>`
            : '';
        view.innerHTML = `
    <div class="nav">
      <a href="#${doc.prefix}">← ${escape(doc.repo)}</a>
      <span class="pn">${prev ? `<a href="#${prev.id}" title="${escape(prev.title)}">← ${prev.id}</a>` : ''}${next ? `<a href="#${next.id}" title="${escape(next.title)}">${next.id} →</a>` : ''}</span>
    </div>
    <header class="head">
      <h1><span class="id">${f.id}</span><span>${inline(f.title)}</span></h1>
      ${f.description ? `<div class="desc" data-quote-for="${escape(f.id)}">${rich(f.description)}</div>` : ''}
      <div class="meta">${chipsHtml(f)}${workChip(f.id)}${waitsChip(f)}<span><a href="#${doc.prefix}/${f.epic.id}">${f.epic.id}</a> ${inline(f.epic.title)}</span>${progressHtml(f.tasks, true)}${approvalHtml(f)}${askedOf(f) ? `<button type="button" class="chip s-ask" data-act="chat-open" data-id="${escape(f.id)}" title="Answer in the notes">${askedOf(f)} ${askedOf(f) === 1 ? 'question' : 'questions'} for you</button>` : ''}${actionsHtml(f)}</div>
      ${f.statusNote ? `<p class="status-note">${inline(f.statusNote)}</p>` : ''}
      ${where(f)}
      ${f.waitingOn ? `<p class="waiting-note">Waiting on ${f.waitingOn.map((w) => inline(w)).join(', ')}</p>` : ''}
      ${depsHtml(f)}
      ${f.epic.blockedBy ? `<p class="waiting-note">Its epic, <a href="#${f.epic.ref}">${f.epic.ref}</a>, waits on ${f.epic.blockedBy.map((b) => `<a href="#${b.id}">${b.id}</a> (${inline(b.why)})`).join(', ')}</p>` : ''}
    </header>
    ${f.chosen ? `<div class="chosen"><p class="label">Chosen${f.chosenOn ? ` (${f.chosenOn})` : ''}</p><div>${block(f.chosen)}</div></div>` : ''}
    ${f.tasks.length ? `<section class="section"><h2 class="label">Plan · ${f.tasks.length} tickets</h2><ol class="steps">${f.tasks.map(step).join('')}</ol></section>` : ''}
    ${SECTIONS.map(section).join('')}
    <nav class="pager" aria-label="Other features">
      ${prev ? `<a class="card prev" href="#${prev.id}"><small>← ${prev.id}</small><span>${inline(prev.title, true)}</span></a>` : ''}
      ${next ? `<a class="card next" href="#${next.id}"><small>${next.id} →</small><span>${inline(next.title, true)}</span></a>` : ''}
    </nav>`;
      }

      function route() {
        return decodeURIComponent(location.hash.replace(/^#/, ''));
      }
      /** The list's addresses: "", a project ("GW"), an epic ("GW/E1"). */
      function listRoute(r) {
        return !r || /^[A-Z]+(\/E\d+)?$/.test(r);
      }

      /** Draws the page for the address; `moved` when the address just changed (not a re-read of the files). */
      function render(moved) {
        if (!state.docs.length) return;
        const r = route();
        const listView = document.getElementById('list-view');
        const detailView = document.getElementById('detail-view');
        if (listRoute(r)) {
          if (moved) state.project = r ? r.split('/')[0] : null;
          document.title = state.project
            ? `${state.docs.find((d) => d.prefix === state.project)?.repo ?? state.project} · Tasks`
            : 'Tasks';
          document.body.classList.remove('is-detail');
          renderList();
          renderChat();
          listView.hidden = false;
          detailView.hidden = true;
          if (moved) {
            const epic = r.includes('/') ? document.getElementById(r) : null;
            if (epic) epic.scrollIntoView({ block: 'start' });
            else document.getElementById('main').scrollTo(0, state.listScroll);
          }
          return;
        }
        const active = document.activeElement;
        const typing = active?.dataset?.draft;
        const caret =
          typing && active.type !== 'radio' ? [active.selectionStart, active.selectionEnd] : null;
        renderDetail(r);
        markQuotes();
        renderChat();
        if (typing) {
          const value = active.type === 'radio' ? `[value="${CSS.escape(active.value)}"]` : '';
          const field = document.querySelector(`[data-draft="${CSS.escape(typing)}"]${value}`);
          field?.focus({ preventScroll: true });
          if (field && caret) field.setSelectionRange(...caret);
        }
        listView.hidden = true;
        detailView.hidden = false;
        document.body.classList.add('is-detail');
        stickHeads();
        if (moved) {
          const target = r.includes('.') ? document.getElementById(r) : null;
          if (target) target.scrollIntoView({ block: 'start' });
          else document.getElementById('main').scrollTo(0, 0);
        }
      }

      /**
       * Each ticket's head height, as --head on its card, for its subtickets' heads to stick under;
       * measured again when a head's height changes (its title wraps, a chip comes).
       */
      const headSizes = new ResizeObserver((entries) => {
        for (const e of entries)
          e.target.parentElement.style.setProperty('--head', `${e.target.offsetHeight}px`);
        markStuck();
      });
      function stickHeads() {
        headSizes.disconnect();
        for (const head of document.querySelectorAll('#detail-view .step > .thead')) {
          head.parentElement.style.setProperty('--head', `${head.offsetHeight}px`);
          headSizes.observe(head);
        }
        markStuck();
      }
      /** A head is stuck when its card's top has gone above it: it gets its line under. */
      function markStuck() {
        for (const head of document.querySelectorAll('#detail-view .thead')) {
          const card = head.parentElement.getBoundingClientRect().top;
          head.classList.toggle('is-stuck', head.getBoundingClientRect().top - card > 1.5);
        }
      }
      let stuckFrame = 0;
      document.getElementById('main').addEventListener(
        'scroll',
        () => {
          cancelAnimationFrame(stuckFrame);
          stuckFrame = requestAnimationFrame(markStuck);
        },
        { passive: true },
      );

      /** Your words no session has taken in yet: answered questions, and your notes it hasn't read. */
      function waitingOf(docs) {
        let n = 0;
        const walk = (t) => [t, ...(t.subtickets ?? []).flatMap(walk)];
        for (const doc of docs)
          for (const epic of doc.epics)
            for (const x of [
              epic,
              ...epic.features.flatMap((f) => [f, ...(f.plan ?? []).flatMap(walk)]),
            ]) {
              n += (x.notes ?? []).filter((note) => note.by !== 'claude' && !note.seen).length;
              n += (x.openChoices ?? []).filter((c) => c.answer).length;
            }
        return n;
      }
      const MINUTE = 60_000;
      /** A worker working with no word for this long shows as "abandoned?". */
      const QUIET = 30 * MINUTE;
      /** A finished or stopped worker stays in the corner this long. */
      const SHOWN = 15 * MINUTE;
      const ago = (at) => Date.now() - new Date(at).getTime();
      const forHow = (ms) =>
        ms < 90 * MINUTE ? `${Math.round(ms / MINUTE)} min` : `${Math.round(ms / (60 * MINUTE))} h`;
      /**
       * What an agent's last word means now: {kind, label, title}, or null when it's no longer shown.
       * The planner and the builder beat while they listen; a worker speaks at every step, and one
       * quiet for half an hour, or that said it quit, is abandoned.
       */
      function agentView(a) {
        const text = a.text ? `: ${a.text}` : '';
        const age = ago(a.at);
        if (a.role === 'planner' || a.role === 'builder') {
          const who = a.role === 'planner' ? 'Planner' : 'Builder';
          const n = a.role === 'planner' ? state.waiting : 0;
          const words = `${n} of your ${n === 1 ? 'words waits' : 'words wait'}`;
          if (a.state === 'working' && age < 30 * MINUTE)
            return {
              kind: 'is-working',
              label: `${who} working${text}`,
              title: `Since ${when(a.since)}`,
            };
          if (a.state === 'listening' && age < MINUTE)
            return {
              kind: 'is-listening',
              label: n
                ? `${who} listening · ${words}, taken in once they settle`
                : `${who} listening`,
              title:
                a.role === 'planner'
                  ? 'It takes in your answers and notes 15 seconds after your last change, and replies here.'
                  : 'It builds what you approve, once what it waits on is done.',
            };
          return {
            kind: 'is-off',
            label: `${who} not running${n ? ` · ${words} for it` : ''}`,
            title:
              a.role === 'planner'
                ? 'Start it: a Claude Code session in the tickets folder, running /keeping-the-plan.'
                : `Last heard ${when(a.at)}${a.text ? ` (${a.text})` : ''}.`,
          };
        }
        const who = `Worker ${a.item ?? a.name}`;
        const title = `${a.name} · since ${when(a.since)} · last word ${when(a.at)}`;
        const item = a.item && itemOf(a.item);
        if (a.state === 'working' || a.state === 'listening') {
          if (item && doneOf(item))
            return age < SHOWN ? { kind: 'is-done', label: `${who} finished${text}`, title } : null;
          if (age < QUIET) return { kind: 'is-working', label: `${who} working${text}`, title };
          return {
            kind: 'is-abandoned',
            label: `${who} abandoned? No word for ${forHow(age)}${text}`,
            forget: true,
            title,
          };
        }
        if (a.state === 'abandoned' || a.state === 'failed') {
          if (item && doneOf(item)) return null;
          return { kind: 'is-abandoned', label: `${who} ${a.state}${text}`, title, forget: true };
        }
        if (age >= SHOWN) return null;
        return {
          kind: a.state === 'done' ? 'is-done' : 'is-off',
          label: `${who} ${a.state === 'done' ? 'finished' : 'stopped'}${text}`,
          title,
          forget: true,
        };
      }
      /** The agents in the corner: the planner (always), the builder, then the workers by when they started. */
      function agentsOf() {
        const rank = { planner: 0, builder: 1, worker: 2 };
        const all = [...state.agents];
        if (!all.some((a) => a.role === 'planner'))
          all.push({
            name: 'planner',
            role: 'planner',
            state: 'stopped',
            text: '',
            at: new Date(0).toISOString(),
            since: new Date(0).toISOString(),
          });
        return all
          .sort((x, y) => rank[x.role] - rank[y.role] || x.since.localeCompare(y.since))
          .map((a) => ({ a, view: agentView(a) }))
          .filter((x) => x.view);
      }
      function renderAgents() {
        const shown = agentsOf();
        document.documentElement.style.setProperty(
          '--bar',
          `${document.getElementById('agents').offsetHeight}px`,
        );
        document.getElementById('agents').innerHTML = shown
          .map(({ a, view }) => {
            const what = a.item
              ? `<a class="what" href="#${escape(a.item)}">${escape(view.label)}</a>`
              : `<span class="what">${escape(view.label)}</span>`;
            const forget = view.forget
              ? `<button type="button" class="forget" data-forget="${escape(a.name)}" aria-label="Forget ${escape(a.name)}" title="Forget it">×</button>`
              : '';
            const waiting = a.role === 'planner' && state.waiting ? ' has-waiting' : '';
            return `<li class="agent ${view.kind}${waiting}" title="${escape(view.title)}"><span class="dot" aria-hidden="true"></span>${what}${forget}</li>`;
          })
          .join('');
        // The cards show who works on them; draw them again only when that changes.
        const key = JSON.stringify(workOf());
        if (key !== state.workKey) {
          state.workKey = key;
          render(false);
        }
      }
      /** Each item a worker is on, as the cards show it: {item, kind, label}. */
      function workOf() {
        return agentsOf()
          .filter(
            ({ a, view }) =>
              a.role === 'worker' &&
              a.item &&
              (view.kind === 'is-working' || view.kind === 'is-abandoned'),
          )
          .map(({ a, view }) => ({
            item: a.item,
            kind: view.kind,
            label:
              view.kind === 'is-working'
                ? 'Worker on it'
                : a.state === 'failed'
                  ? 'Worker failed'
                  : 'Abandoned?',
            title: view.label,
          }));
      }
      /** The chip on a card or row: a worker is on this item (or, with `within`, on one under it). */
      function workChip(id, within = false) {
        const hits = (state.workKey ? JSON.parse(state.workKey) : []).filter(
          (w) => w.item === id || (within && w.item.startsWith(`${id}.`)),
        );
        if (!hits.length) return '';
        const lost = hits.filter((w) => w.kind === 'is-abandoned');
        const w = lost[0] ?? hits[0];
        const label = hits.length > 1 && !lost.length ? `${hits.length} workers on it` : w.label;
        return `<span class="chip ${lost.length ? 's-abandoned' : 's-working'}" title="${escape(hits.map((h) => h.title).join('\n'))}">${escape(label)}</span>`;
      }

      async function load(force = false) {
        try {
          const response = await fetch('tasks.json', { cache: 'no-store' });
          if (!response.ok)
            throw new Error(`tasks.json: ${response.status} ${await response.text()}`);
          const text = await response.text();
          document.getElementById('error').hidden = true;
          document.getElementById('updated').textContent =
            `Read ${new Date().toLocaleTimeString([], { hour12: false })}`;
          if (text !== state.raw) {
            const first = state.raw === null;
            state.raw = text;
            const docs = JSON.parse(text);
            state.waiting = waitingOf(docs);
            state.docs = build(docs);
            render(first);
          } else if (force) render(false);
          state.agents = await (
            await fetch('agents', { cache: 'no-store' })
          )
            .json()
            .catch(() => []);
          if (!Array.isArray(state.agents)) state.agents = [];
          renderAgents();
          renderChat();
        } catch (error) {
          const box = document.getElementById('error');
          box.hidden = false;
          box.textContent = `Could not read the tasks (${error.message}). Run node scripts/tasks-view.mjs and open http://127.0.0.1:4741.`;
        }
      }

      let shownRoute = route();
      window.addEventListener('hashchange', () => {
        if (listRoute(shownRoute)) state.listScroll = document.getElementById('main').scrollTop;
        shownRoute = route();
        render(true);
      });
      document.getElementById('projects').addEventListener('click', (event) => {
        const button = event.target.closest('[data-project]');
        if (!button) return;
        location.hash = button.dataset.project === 'all' ? '' : button.dataset.project;
      });
      for (const [id, key] of [
        ['filters', 'filter'],
        ['places', 'place'],
      ]) {
        document.getElementById(id).addEventListener('click', (event) => {
          const button = event.target.closest(`[data-${key}]`);
          if (!button) return;
          state[key] = button.dataset[key] === 'all' ? null : button.dataset[key];
          renderList();
        });
      }
      document.getElementById('agents').addEventListener('click', async (event) => {
        const button = event.target.closest('[data-forget]');
        if (!button) return;
        await fetch('agents', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ name: button.dataset.forget, state: 'clear' }),
        });
        load();
      });
      /** One edit through the server (POST /edit), which writes it to its file. */
      async function post(edit) {
        const response = await fetch('edit', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(edit),
        });
        if (!response.ok) throw new Error(await response.text());
      }
      /** The edit a button asks for, or null when there's nothing to write. */
      function editOf(button) {
        const { act, id } = button.dataset;
        const index = Number(button.dataset.index);
        switch (act) {
          case 'approve':
            return { op: 'approve', id, approved: button.dataset.to === 'true' };
          case 'cancel':
            return { op: 'cancel', id, cancelled: button.dataset.to === 'true' };
          case 'note': {
            const text = (state.drafts[`note:${state.chat}`] ?? '').trim();
            const q = state.chatQuote;
            return text
              ? {
                  op: 'note',
                  id,
                  text,
                  ...(q ? { quote: q.quote, ...(q.nth ? { nth: q.nth } : {}) } : {}),
                }
              : null;
          }
          case 'unnote':
            return confirm('Delete this note?')
              ? { op: 'unnote', id, at: button.dataset.at }
              : null;
          case 'answer':
            return { op: 'answer', id, index, answer: draftAnswer(itemOf(id), index) };
          case 'unanswer':
            return { op: 'answer', id, index, answer: '' };
          default:
            return null;
        }
      }
      // The buttons: Approve, Cancel, Note, Save answer… Each writes, then the files are read again.
      document.addEventListener('click', async (event) => {
        const button = event.target.closest('button[data-act]');
        if (!button) return;
        event.preventDefault();
        const { act, id } = button.dataset;
        if (act === 'chat-open') {
          if (state.chatAbout === id && !document.getElementById('chat').hidden) closeChat();
          else openChat(id);
          return;
        }
        if (act === 'chat-close') return closeChat();
        if (act === 'chat-fold') {
          state.chatResolved = !state.chatResolved;
          return renderChat();
        }
        // ×: off the fragment, then off the ticket, back to the feature.
        if (act === 'chat-unquote') {
          if (state.chatQuote) state.chatQuote = null;
          else state.chatAbout = state.chat;
          return render(false);
        }
        if (act === 'chat-reply') {
          return openChat(
            id,
            button.dataset.quote
              ? { quote: button.dataset.quote, nth: Number(button.dataset.nth) || 0 }
              : null,
          );
        }
        if (act === 'chat-mark') {
          const key = button.dataset.key;
          const mark = document.querySelector(`mark.quote-mark[data-key="${CSS.escape(key)}"]`);
          const of = key.slice(0, key.indexOf('|'));
          if (!document.querySelector(`#detail-view [data-quote-for="${CSS.escape(of)}"]`))
            location.hash = of;
          mark?.scrollIntoView({ block: 'center', behavior: 'smooth' });
          return;
        }
        const edit = editOf(button);
        if (!edit) return;
        const box = document.getElementById('error');
        // Every button waits while it saves; those still on the page afterwards (the chat's, when
        // nothing in it changed) get back the state they had.
        const waiting = [...document.querySelectorAll('button[data-act]')].map((b) => [
          b,
          b.disabled,
        ]);
        for (const [b] of waiting) b.disabled = true;
        let saved = false;
        try {
          await post(edit);
          saved = true;
          box.hidden = true;
          if (act === 'note') {
            delete state.drafts[`note:${state.chat}`];
            state.chatQuote = null;
            state.chatStick = true;
            const input = document.getElementById('chat-input');
            input.value = '';
            growInput();
          }
          if (edit.op === 'answer') {
            delete state.drafts[`pick:${id}:${edit.index}`];
            delete state.drafts[`other:${id}:${edit.index}`];
          }
        } catch (error) {
          box.hidden = false;
          box.textContent = `Could not save it (${error.message}).`;
        }
        await load(true);
        for (const [b, was] of waiting) if (b.isConnected) b.disabled = was;
        if (saved && act === 'approve' && edit.approved) noticeHeld(id);
        if (saved && act === 'cancel' && edit.cancelled) noticeCancelled(id);
      });
      // Typing keeps its draft; writing your own answer picks it; Save lights up once there's a change.
      function keepDraft(event) {
        const field = event.target.closest?.('[data-draft]');
        if (!field) return;
        if (field.type !== 'radio') state.drafts[field.dataset.draft] = field.value;
        else if (field.checked) state.drafts[field.dataset.draft] = field.value;
        if (field.dataset.pick && field.value.trim()) {
          state.drafts[field.dataset.pick] = 'other';
          const own = document.querySelector(
            `input[type="radio"][data-draft="${CSS.escape(field.dataset.pick)}"][value="other"]`,
          );
          if (own) own.checked = true;
        }
        const question = /^(?:pick|other):(.+):(\d+)$/.exec(field.dataset.draft);
        if (question) {
          const [, fid, i] = question;
          const save = document.querySelector(
            `button[data-act="answer"][data-id="${CSS.escape(fid)}"][data-index="${i}"]`,
          );
          if (save) save.disabled = !canSave(itemOf(fid), Number(i));
        }
      }
      document.addEventListener('input', keepDraft);
      document.addEventListener('change', keepDraft);
      // In the composer Enter sends and Shift+Enter starts a line; Esc closes the chat.
      document.getElementById('chat-input').addEventListener('keydown', (event) => {
        if (event.key !== 'Enter' || event.shiftKey || event.isComposing) return;
        event.preventDefault();
        const send = document.getElementById('chat-send');
        if (!send.disabled && event.target.value.trim()) send.click();
      });
      document.getElementById('chat-input').addEventListener('input', growInput);
      document.addEventListener('keydown', (event) => {
        if (event.key !== 'Escape' || document.getElementById('chat').hidden) return;
        const field = event.target.closest?.('textarea, input');
        if (field && field.id !== 'chat-input' && field.value) return;
        closeChat();
      });
      // Quotes are matched without their whitespace: a selection across paragraphs reads "a\n\nb"
      // while the page's text reads "ab".
      const bare = (s) => s.replace(/\s+/g, '');
      /** Wraps the nth place a quote is in `root` in marks; false when the text no longer has it. */
      function markQuote(root, quote, nth, key, draft) {
        const nodes = [];
        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
        while (walker.nextNode()) nodes.push(walker.currentNode);
        let text = '';
        const at = [];
        for (const node of nodes)
          for (let i = 0; i < node.data.length; i++)
            if (!/\s/.test(node.data[i])) {
              text += node.data[i];
              at.push([node, i]);
            }
        const q = bare(quote);
        let start = -1;
        for (let k = 0, i = text.indexOf(q); i >= 0; i = text.indexOf(q, i + 1), k++)
          if (k === nth) {
            start = i;
            break;
          }
        if (start < 0 || !q) return false;
        const [first, from] = at[start];
        const [last, to] = at[start + q.length - 1];
        for (let k = nodes.indexOf(first); k <= nodes.indexOf(last); k++) {
          const node = nodes[k];
          const a = node === first ? from : 0;
          const b = node === last ? to + 1 : node.data.length;
          if (b <= a || !node.data.slice(a, b).trim()) continue;
          const range = document.createRange();
          range.setStart(node, a);
          range.setEnd(node, b);
          const mark = document.createElement('mark');
          mark.className = `quote-mark${draft ? ' is-draft' : ''}`;
          mark.dataset.key = key;
          range.surroundContents(mark);
        }
        return true;
      }
      /** Marks every fragment a note quotes (and the one the composer is on) in its description. */
      function markQuotes() {
        const view = document.getElementById('detail-view');
        for (const root of view.querySelectorAll('[data-quote-for]')) {
          const id = root.dataset.quoteFor;
          const x = itemOf(id);
          if (!x) continue;
          const quoted = new Map();
          for (const n of x.notes ?? []) {
            if (!n.quote) continue;
            const key = threadKey(n);
            const q = quoted.get(key) ?? { quote: n.quote, nth: n.nth ?? 0, closed: true };
            q.closed &&= Boolean(n.closed);
            quoted.set(key, q);
          }
          if (state.chatAbout === id && state.chatQuote && !quoted.has(threadKey(state.chatQuote)))
            quoted.set(threadKey(state.chatQuote), { ...state.chatQuote, draft: true });
          for (const [k, q] of quoted) {
            const key = `${id}|${k}`;
            if (!markQuote(root, q.quote, q.nth, key, q.draft)) continue;
            if (q.closed && !q.draft)
              for (const m of root.querySelectorAll(
                `mark.quote-mark[data-key="${CSS.escape(key)}"]`,
              ))
                m.classList.add('is-closed');
          }
        }
      }
      const litKey = (event) =>
        event.target.closest?.('mark.quote-mark, .msg[data-key]')?.dataset.key;
      for (const [type, on] of [
        ['mouseover', true],
        ['mouseout', false],
      ])
        document.addEventListener(type, (event) => {
          const key = litKey(event);
          if (!key || key.endsWith('|')) return;
          for (const el of document.querySelectorAll(
            `mark.quote-mark[data-key="${CSS.escape(key)}"], .msg[data-key="${CSS.escape(key)}"]`,
          ))
            el.classList.toggle('is-lit', on);
        });
      // A click on a marked fragment opens its notes, at the first one about it.
      document.addEventListener('click', (event) => {
        const mark = event.target.closest?.('mark.quote-mark');
        if (!mark) return;
        const key = mark.dataset.key;
        const id = key.slice(0, key.indexOf('|'));
        const x = itemOf(id);
        if (x && state.chat !== refOf(chatOf(x))) openChat(id);
        const msg = document.querySelector(`#chat-log .msg[data-key="${CSS.escape(key)}"]`);
        if (msg) {
          msg.scrollIntoView({ block: 'center', behavior: 'smooth' });
          msg.classList.add('is-flash');
          setTimeout(() => msg.classList.remove('is-flash'), 1200);
        }
      });
      // Selecting text in a description offers "Note on this", which opens a note on that fragment.
      const quoteButton = document.createElement('button');
      quoteButton.type = 'button';
      quoteButton.className = 'quote-button';
      quoteButton.textContent = 'Note on this';
      quoteButton.hidden = true;
      document.body.append(quoteButton);
      let picked = null;
      function offerQuote() {
        const selection = getSelection();
        picked = null;
        quoteButton.hidden = true;
        if (!selection.rangeCount || selection.isCollapsed) return;
        const range = selection.getRangeAt(0);
        const within = (n) => (n.nodeType === 1 ? n : n.parentElement)?.closest('[data-quote-for]');
        const root = within(range.startContainer);
        if (!root || root !== within(range.endContainer)) return;
        const quote = selection.toString().replace(/\s+/g, ' ').trim();
        if (!quote || quote.length > 1000) return;
        const before = document.createRange();
        before.setStart(root, 0);
        before.setEnd(range.startContainer, range.startOffset);
        const where = bare(before.toString()).length;
        const text = bare(root.textContent);
        const q = bare(quote);
        const hits = [];
        for (let i = text.indexOf(q); i >= 0; i = text.indexOf(q, i + 1)) hits.push(i);
        if (!hits.length) return;
        const nth = hits.reduce(
          (best, h, k) => (Math.abs(h - where) < Math.abs(hits[best] - where) ? k : best),
          0,
        );
        picked = { id: root.dataset.quoteFor, quote, nth };
        const box = range.getBoundingClientRect();
        quoteButton.hidden = false;
        quoteButton.style.top = `${box.bottom + 6}px`;
        quoteButton.style.left = `${Math.max(8, Math.min(box.right - quoteButton.offsetWidth, document.documentElement.clientWidth - quoteButton.offsetWidth - 8))}px`;
      }
      document.addEventListener('mouseup', () => setTimeout(offerQuote));
      document.addEventListener('keyup', (event) => {
        if (event.shiftKey) offerQuote();
      });
      // Keep the selection when the button is pressed.
      quoteButton.addEventListener('mousedown', (event) => event.preventDefault());
      quoteButton.addEventListener('click', () => {
        if (!picked) return;
        quoteButton.hidden = true;
        getSelection().removeAllRanges();
        openChat(picked.id, { quote: picked.quote, nth: picked.nth });
      });
      // The page scrolls inside its panel now: a scroll there moves the selection from under the button.
      document
        .getElementById('main')
        .addEventListener('scroll', () => (quoteButton.hidden = true), {
          passive: true,
        });

      /** After a cancel: the items outside it that wait on it, and now can't be built. */
      function noticeCancelled(id) {
        const item = itemOf(id);
        const notice = document.getElementById('notice');
        if (!item) return;
        const inside = new Set();
        const walk = (x) => {
          inside.add(refOf(x));
          childrenOf(x).forEach(walk);
        };
        walk(item);
        const waiting = new Map();
        for (const ref of inside)
          for (const y of state.blocks.get(ref) ?? [])
            if (!inside.has(refOf(y)) && !cancelledOf(y)) waiting.set(refOf(y), ref);
        if (!waiting.size) {
          notice.hidden = true;
          return;
        }
        const rows = [...waiting]
          .map(([y, on]) => `<li><a href="#${y}">${y}</a> waits on ${on}</li>`)
          .join('');
        notice.querySelector('.text').innerHTML =
          `Cancelled ${escape(id)}. ${waiting.size === 1 ? 'One item waits' : `${waiting.size} items wait`} on it, and can't be built while it isn't done:<ul>${rows}</ul>`;
        notice.hidden = false;
      }
      /** After an approval: what of it can't be built yet, and what it waits on. */
      function noticeHeld(id) {
        const item = itemOf(id);
        const held = item ? heldOf(item) : [];
        const notice = document.getElementById('notice');
        if (!held.length) {
          notice.hidden = true;
          return;
        }
        // Each blocker once, with why and which of the approved items wait on it.
        const blockers = new Map();
        for (const l of held)
          for (const w of waitsOf(l)) {
            const entry = blockers.get(w.id) ?? { ...w, items: [] };
            entry.items.push(l.id);
            blockers.set(w.id, entry);
          }
        const all = held.length === leavesOf(item).length;
        const rows = [...blockers.values()]
          .map(
            (b) =>
              `<li><a href="#${b.id}">${b.id}</a> ${inline(b.why)}${all || held.length === 1 ? '' : ` <span class="for">for ${b.items.length === held.length ? 'each' : b.items.join(', ')}</span>`}</li>`,
          )
          .join('');
        const who =
          held.length === 1 && held[0] === item
            ? 'It waits'
            : all
              ? `All ${held.length} of its items wait`
              : `${held.length} of its ${leavesOf(item).length} items wait`;
        const text = `Approved ${escape(id)}. ${who} on what isn't done yet, and will be built after it:<ul>${rows}</ul>`;
        notice.querySelector('.text').innerHTML = text;
        notice.hidden = false;
      }
      document.getElementById('notice').addEventListener('click', (event) => {
        if (event.target.closest('button')) document.getElementById('notice').hidden = true;
      });
      document.getElementById('find').addEventListener('input', (event) => {
        state.find = event.target.value;
        renderList();
      });

      /** Reloads the page when viewer.html changes, so an open tab never shows new tasks with old code. */
      let page = null;
      async function checkPage() {
        try {
          const text = await (await fetch('./', { cache: 'no-store' })).text();
          if (page !== null && text !== page) location.reload();
          page = text;
        } catch {
          // the server is down; load() says so
        }
      }

      load();
      setInterval(load, 2000);
      checkPage();
      setInterval(checkPage, 5000);
    </script>
  </body>
</html>
