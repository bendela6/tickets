<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tasks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
    <style>
      :root {
        --page: #f2f1ec;
        --raised: #ffffff;
        --line: #e0ddd5;
        --soft: #edece6;
        --hover: #f7f6f2;
        --target: #f4f2ff;
        --text: #25231d;
        --muted: #5d5a50;
        --quiet: #6a665b;
        --none-bg: #edece6;
        --none-fg: #5d5a50;
        --planning-bg: #e5eaff;
        --planning-fg: #392aa4;
        --planned-bg: #deeeff;
        --planned-fg: #12438e;
        --designed-bg: #f6e9ff;
        --designed-fg: #602681;
        --waiting-bg: #ffe7d9;
        --waiting-fg: #853500;
        --progress-bg: #e5eaff;
        --progress-fg: #392aa4;
        --done-bg: #e1f2e4;
        --done-fg: #13562b;
        --done-bar: #2e7042;
        --chosen-bg: #f4f2ff;
        --chosen-line: #dcd8fb;
        --ask-bg: #fbf0d0;
        --ask-fg: #6b4a00;
        --link: #392aa4;
        --focus: #4e46c6;
        --r-tickets-bg: #dff3f1;
        --r-tickets-fg: #0b5a55;
        --r-bh-bg: #f6e9ff;
        --r-bh-fg: #602681;
        --r-gateway-bg: #deeeff;
        --r-gateway-fg: #12438e;
        --r-medialib-bg: #fbf0d0;
        --r-medialib-fg: #6b4a00;
        --r-live-bg: #fde8e6;
        --r-live-fg: #9e1a15;
        --r-signals-bg: #ffe7d9;
        --r-signals-fg: #853500;
        --r-items-core-bg: #e1f2e4;
        --r-items-core-fg: #13562b;
        --r-other-bg: #edece6;
        --r-other-fg: #5d5a50;
        --code-keyword: #7a2fb8;
        --code-type: #0b6e78;
        --code-key: #1f4fa8;
        --code-string: #2f6b1c;
        --code-literal: #9a4a00;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #1b1a17;
          --raised: #252320;
          --line: #343128;
          --soft: #2f2c25;
          --hover: #2a2823;
          --target: #262341;
          --text: #edebe3;
          --muted: #a6a296;
          --quiet: #8f8b80;
          --none-bg: #2f2c25;
          --none-fg: #a6a296;
          --planning-bg: #22203d;
          --planning-fg: #b0abff;
          --planned-bg: #192536;
          --planned-fg: #aed4ff;
          --designed-bg: #2a1a36;
          --designed-fg: #e3b8ff;
          --waiting-bg: #351f0e;
          --waiting-fg: #ffc594;
          --progress-bg: #22203d;
          --progress-fg: #b0abff;
          --done-bg: #142a1b;
          --done-fg: #a5eaba;
          --done-bar: #5bbf7a;
          --chosen-bg: #23213a;
          --chosen-line: #36325c;
          --ask-bg: #2e2410;
          --ask-fg: #f0cf7a;
          --link: #b0abff;
          --focus: #918aec;
          --r-tickets-bg: #12302d;
          --r-tickets-fg: #8fe0d6;
          --r-bh-bg: #2a1a36;
          --r-bh-fg: #e3b8ff;
          --r-gateway-bg: #192536;
          --r-gateway-fg: #aed4ff;
          --r-medialib-bg: #2e2410;
          --r-medialib-fg: #f0cf7a;
          --r-live-bg: #3a1714;
          --r-live-fg: #ffaaa1;
          --r-signals-bg: #351f0e;
          --r-signals-fg: #ffc594;
          --r-items-core-bg: #142a1b;
          --r-items-core-fg: #a5eaba;
          --r-other-bg: #2f2c25;
          --r-other-fg: #a6a296;
          --code-keyword: #d0a8ff;
          --code-type: #74d4de;
          --code-key: #9cc2ff;
          --code-string: #b1dc93;
          --code-literal: #f2b679;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      /* The body never scrolls: the page and the chat beside it each scroll on their own. */
      body {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        margin: 0;
        background: var(--page);
        color: var(--text);
        font:
          14px/1.55 'IBM Plex Sans',
          system-ui,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        --main-top: 32px;
        padding: var(--main-top) clamp(16px, 3vw, 40px) 80px;
      }
      a {
        color: var(--link);
        text-underline-offset: 2px;
      }
      code {
        font:
          12.5px/1.4 'IBM Plex Mono',
          ui-monospace,
          monospace;
        background: var(--soft);
        border-radius: 4px;
        padding: 1px 4px;
        overflow-wrap: anywhere;
      }
      :focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      .mono {
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
      }
      .label {
        margin: 0 0 8px;
        font-size: 12px;
        line-height: 16px;
        font-weight: 500;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .card {
        background: var(--raised);
        border: 1px solid var(--line);
        border-radius: 12px;
      }
      .chip {
        display: inline-block;
        font-size: 12px;
        line-height: 18px;
        font-weight: 500;
        border-radius: 999px;
        padding: 1px 9px;
        white-space: nowrap;
      }
      .s-none {
        background: var(--none-bg);
        color: var(--none-fg);
      }
      .s-planning {
        background: var(--planning-bg);
        color: var(--planning-fg);
      }
      .s-planned {
        background: var(--planned-bg);
        color: var(--planned-fg);
      }
      .s-designed {
        background: var(--designed-bg);
        color: var(--designed-fg);
      }
      .s-waiting {
        background: var(--waiting-bg);
        color: var(--waiting-fg);
      }
      .s-progress {
        background: var(--progress-bg);
        color: var(--progress-fg);
      }
      .s-done {
        background: var(--done-bg);
        color: var(--done-fg);
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .progress {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
      }
      .meter {
        width: 56px;
        height: 4px;
        border-radius: 2px;
        background: var(--soft);
        overflow: hidden;
      }
      .meter > span {
        display: block;
        height: 100%;
        background: var(--done-bar);
      }
      .repo {
        display: inline-block;
        font:
          500 11.5px/18px 'IBM Plex Mono',
          ui-monospace,
          monospace;
        border-radius: 4px;
        padding: 0 6px;
        white-space: nowrap;
      }
      .r-tickets {
        background: var(--r-tickets-bg);
        color: var(--r-tickets-fg);
      }
      .r-bh {
        background: var(--r-bh-bg);
        color: var(--r-bh-fg);
      }
      .r-gateway {
        background: var(--r-gateway-bg);
        color: var(--r-gateway-fg);
      }
      .r-medialib {
        background: var(--r-medialib-bg);
        color: var(--r-medialib-fg);
      }
      .r-live-gateway {
        background: var(--r-live-bg);
        color: var(--r-live-fg);
      }
      .r-signals {
        background: var(--r-signals-bg);
        color: var(--r-signals-fg);
      }
      .r-items-core {
        background: var(--r-items-core-bg);
        color: var(--r-items-core-fg);
      }
      .r-other {
        background: var(--r-other-bg);
        color: var(--r-other-fg);
      }
      .repos {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 8px;
      }
      .where {
        margin: 6px 0 0;
        font:
          12px/22px 'IBM Plex Mono',
          ui-monospace,
          monospace;
        color: var(--muted);
      }
      .where-label {
        margin-right: 8px;
        font:
          500 11px/16px 'IBM Plex Sans',
          system-ui,
          sans-serif;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--quiet);
      }
      .places {
        margin-top: 8px;
      }
      .places .filter {
        height: 30px;
      }
      .error {
        margin-top: 16px;
        padding: 12px 16px;
        border-radius: 8px;
        background: var(--waiting-bg);
        color: var(--waiting-fg);
      }

      /* The list */
      .top {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 16px;
      }
      h1 {
        margin: 0;
        font-size: 24px;
        line-height: 32px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .updated {
        font-size: 12px;
        color: var(--quiet);
      }
      .totals {
        margin: 4px 0 0;
        font-size: 13px;
        color: var(--muted);
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-top: 20px;
      }
      .bar input {
        flex: 1 1 240px;
        min-width: 0;
        height: 36px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--raised);
        color: var(--text);
        font: inherit;
      }
      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .filter {
        height: 32px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--raised);
        color: var(--text);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .filter[aria-pressed='true'] {
        border-color: var(--focus);
        box-shadow: inset 0 0 0 1px var(--focus);
      }
      .filter .n {
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 12px;
        color: var(--muted);
      }
      .group {
        margin-top: 36px;
        scroll-margin-top: 24px;
      }
      .epic-head {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 12px;
      }
      .epic-head .eid {
        font:
          500 13px/24px 'IBM Plex Mono',
          ui-monospace,
          monospace;
        color: var(--quiet);
        text-decoration: none;
      }
      .epic-head .eid:hover {
        text-decoration: underline;
      }
      .epic-head h2 {
        margin: 0;
        font-size: 17px;
        line-height: 24px;
        font-weight: 600;
      }
      .epic-head .n {
        font-size: 12px;
        color: var(--quiet);
      }
      .epic-head .progress {
        margin-left: auto;
      }
      .epic-desc {
        margin: 2px 0 12px;
        font-size: 13.5px;
        color: var(--muted);
        max-width: 76ch;
      }
      .rows {
        list-style: none;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      .rows > li + li {
        border-top: 1px solid var(--line);
      }
      .row {
        display: grid;
        grid-template-columns: 52px minmax(0, 1fr) auto;
        gap: 2px 16px;
        padding: 14px 16px;
        color: inherit;
        text-decoration: none;
      }
      .row:hover {
        background: var(--hover);
      }
      .row .id {
        font:
          500 12.5px/22px 'IBM Plex Mono',
          ui-monospace,
          monospace;
        color: var(--quiet);
        white-space: nowrap;
      }
      .row .title {
        display: block;
        font-size: 15px;
        line-height: 22px;
        font-weight: 600;
      }
      .row .desc {
        margin-top: 2px;
        font-size: 13.5px;
        color: var(--muted);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .row .side {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
        padding-top: 2px;
      }
      .row .side .chips {
        justify-content: flex-end;
      }
      .empty {
        padding: 24px 16px;
        color: var(--muted);
      }

      /* A feature */
      .nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 8px 16px;
        font-size: 13px;
      }
      .nav a {
        text-decoration: none;
      }
      .nav a:hover {
        text-decoration: underline;
      }
      .nav .pn {
        display: flex;
        gap: 16px;
      }
      .head {
        margin-top: 20px;
      }
      .head h1 {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 12px;
      }
      .head h1 .id {
        font:
          500 16px/32px 'IBM Plex Mono',
          ui-monospace,
          monospace;
        color: var(--quiet);
      }
      .head .desc {
        margin: 8px 0 0;
        font-size: 15px;
        line-height: 1.6;
      }
      .head .desc > p {
        max-width: 76ch;
      }
      .desc > p {
        margin: 0;
      }
      .desc > * + * {
        margin-top: 8px;
      }
      .desc pre {
        margin-bottom: 0;
        padding: 10px 12px;
        background: var(--soft);
        border-radius: 8px;
        color: var(--text);
        white-space: pre-wrap;
        overflow-wrap: break-word;
      }
      .desc pre code {
        font-size: 12px;
        line-height: 1.55;
        background: none;
        border-radius: 0;
        padding: 0;
        overflow-wrap: normal;
      }
      .desc pre .cm {
        color: var(--muted);
      }
      .desc pre .kw {
        color: var(--code-keyword);
      }
      .desc pre .ty {
        color: var(--code-type);
      }
      .desc pre .pr {
        color: var(--code-key);
      }
      .desc pre .st {
        color: var(--code-string);
      }
      .desc pre .nu {
        color: var(--code-literal);
      }
      .meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 16px;
        margin-top: 16px;
        font-size: 13px;
        color: var(--muted);
      }
      .waiting-note {
        margin: 8px 0 0;
        font-size: 13px;
        color: var(--waiting-fg);
      }
      .chosen {
        margin-top: 24px;
        padding: 12px 16px;
        border-radius: 10px;
        background: var(--chosen-bg);
        border: 1px solid var(--chosen-line);
      }
      .chosen .label {
        margin-bottom: 2px;
      }
      .chosen ul,
      .chosen ol {
        margin: 6px 0 0;
        padding-left: 20px;
      }
      .section {
        margin-top: 28px;
      }
      .section .card {
        padding: 12px 16px;
      }
      .section .card > p {
        margin: 0;
      }
      .section ul,
      .section ol {
        margin: 6px 0 0;
        padding-left: 20px;
      }
      .section .card > ul:first-child {
        margin-top: 0;
      }
      .section li {
        margin: 4px 0;
      }
      /* A plan: each ticket a card, its subtickets cards inside it. */
      .steps,
      .subs {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .step {
        padding: 14px 16px;
        scroll-margin-top: 24px;
      }
      .subs {
        gap: 8px;
        margin-top: 12px;
      }
      .sub {
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--page);
        scroll-margin-top: calc(var(--head, 0px) + 8px);
      }
      .thead {
        display: grid;
        grid-template-columns: 18px 64px minmax(0, 1fr) auto;
        gap: 2px 12px;
        align-items: start;
      }
      .sub > .thead {
        grid-template-columns: 14px 80px minmax(0, 1fr) auto;
        gap: 2px 10px;
      }
      /* A ticket's head stays at the top of the panel while its card scrolls by, a subticket's under
         it (--head, its ticket's head's height, measured). The head reaches the card's edges and
         wears its background, so what scrolls under it is hidden. */
      .step > .thead,
      .sub > .thead {
        position: sticky;
        background: inherit;
      }
      /* A sticky head's top counts from inside the panel's padding: minus it, it's the panel's top. */
      .step > .thead {
        top: calc(-1 * var(--main-top));
        z-index: 2;
        margin: -14px -16px 0;
        padding: 14px 16px 4px;
        border-radius: 11px 11px 0 0;
      }
      .sub > .thead {
        top: calc(var(--head, 0px) - var(--main-top));
        z-index: 1;
        margin: -10px -12px 0;
        padding: 10px 12px 4px;
        border-radius: 7px 7px 0 0;
      }
      .thead:last-child,
      .thead:has(+ .tbody:empty) {
        padding-bottom: 0;
      }
      /* Stuck: a line under it, where the card's text goes under. */
      .thead.is-stuck {
        border-radius: 0;
        box-shadow: 0 1px 0 var(--line);
      }
      .tbody {
        margin-left: 106px;
      }
      .sub > .tbody {
        margin-left: 114px;
      }
      .tbody > :first-child {
        margin-top: 0;
      }
      .tbody:empty {
        display: none;
      }
      .box {
        width: 16px;
        height: 16px;
        margin-top: 3px;
        border: 1.5px solid var(--quiet);
        border-radius: 50%;
        display: grid;
        place-items: center;
      }
      .box svg {
        display: none;
      }
      .is-done > .thead > .box {
        background: var(--done-bar);
        border-color: var(--done-bar);
      }
      .is-done > .thead > .box svg,
      .is-cancelled > .thead > .box svg {
        display: block;
      }
      .is-cancelled > .thead > .box {
        background: var(--quiet);
        border-color: var(--quiet);
      }
      .thead > .id {
        font:
          500 12.5px/22px 'IBM Plex Mono',
          ui-monospace,
          monospace;
        color: var(--quiet);
        text-decoration: none;
        white-space: nowrap;
      }
      .thead > .id:hover {
        text-decoration: underline;
      }
      .thead > .title {
        font-weight: 600;
        line-height: 22px;
        min-width: 0;
      }
      .thead > .title .subcount {
        margin-left: 8px;
        font:
          400 12px/22px 'IBM Plex Mono',
          ui-monospace,
          monospace;
        color: var(--quiet);
      }
      .is-done > .thead > .title {
        color: var(--muted);
      }
      .is-done > .thead > .title .tt {
        text-decoration: line-through;
      }
      .thead > .title .chip,
      .thead > .title .yours {
        margin-left: 8px;
        vertical-align: 1px;
      }
      .tbody > .desc {
        margin: 0;
        font-size: 13.5px;
        color: var(--muted);
      }
      .tbody > .desc ul {
        margin: 4px 0 0;
        padding-left: 18px;
      }
      .tbody > .where {
        margin-top: 4px;
      }
      .step.is-target,
      .sub.is-target {
        background: var(--target);
        border-color: var(--focus);
      }
      .sub > .thead > .box {
        width: 13px;
        height: 13px;
        margin-top: 4px;
      }
      .sub > .thead > .id {
        font-size: 12px;
      }
      .sub > .thead > .title {
        font-size: 13.5px;
        font-weight: 500;
      }
      /* Cancelled: it won't be built. */
      /* The whole card at half strength, never tinted; a cancelled card inside one isn't dimmed twice. */
      .step.is-cancelled,
      .sub.is-cancelled {
        opacity: 0.5;
        filter: grayscale(1);
      }
      .is-cancelled .is-cancelled {
        opacity: 1;
        filter: none;
      }
      .step.is-cancelled.is-target {
        background: var(--raised);
        border-color: var(--line);
      }
      .sub.is-cancelled.is-target {
        background: var(--page);
        border-color: var(--line);
      }
      /* Its text greyed like a disabled control's: title, description, links and code alike. */
      .is-cancelled > .thead > .title,
      .is-cancelled > .tbody,
      .is-cancelled > .tbody a,
      .is-cancelled > .thead > .title a {
        color: var(--quiet);
      }
      .is-cancelled > .thead > .title {
        font-weight: 500;
      }
      .is-cancelled > .thead > .title .tt {
        text-decoration: line-through;
      }
      .s-cancelled {
        background: var(--none-bg);
        color: var(--none-fg);
        box-shadow: inset 0 0 0 1px var(--quiet);
      }
      .s-ask {
        background: var(--ask-bg);
        color: var(--ask-fg);
      }
      /* The buttons on an item: Approve, Cancel, Note. */
      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 6px;
      }
      .act {
        flex: none;
        height: 24px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        font:
          500 12px/22px 'IBM Plex Sans',
          system-ui,
          sans-serif;
        cursor: pointer;
        white-space: nowrap;
      }
      .act:hover {
        border-color: var(--focus);
        color: var(--text);
      }
      .act[aria-pressed='true'] {
        background: var(--none-bg);
        border-color: var(--quiet);
        color: var(--text);
      }
      .act:disabled,
      .act[aria-disabled='true'] {
        opacity: 0.5;
        cursor: default;
      }
      /* Notes: the user's words on an item, and the planner's replies; one block per thread (the
         item's own notes, and each quoted fragment's). Inline under the item on a narrow page, in
         the margin beside it on a wide one. */
      .notes {
        margin-top: 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .workspace {
        flex: 1;
        min-height: 0;
        display: flex;
      }
      main {
        flex: 1 1 0;
        min-width: 0;
        overflow-y: auto;
        scroll-padding-top: 12px;
      }
      /* The chat: the right half, full height, from the agents bar down. */
      .chat {
        flex: 0 0 50%;
        min-width: 0;
        display: flex;
        flex-direction: column;
        border-left: 1px solid var(--line);
        background: var(--page);
      }
      .chat[hidden] {
        display: none;
      }
      @media (max-width: 899px) {
        .chat {
          flex-basis: 100%;
          border-left: 0;
        }
        body.chat-open main {
          display: none;
        }
      }
      .chat-head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px 10px 16px;
        border-bottom: 1px solid var(--line);
      }
      .chat-title {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .chat-title .chat-id {
        flex: none;
        font:
          500 13px/20px 'IBM Plex Mono',
          ui-monospace,
          monospace;
        color: var(--quiet);
        text-decoration: none;
      }
      .chat-title .chat-name {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 600;
      }
      .chat-state {
        flex: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--muted);
      }
      .chat-state .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--quiet);
      }
      .chat-state.is-listening .dot {
        background: var(--done-fg);
      }
      .chat-state.is-working .dot {
        background: var(--ask-fg);
        animation: pulse 1.2s ease-in-out infinite;
      }
      .chat-close {
        flex: none;
        width: 32px;
        height: 32px;
        border: 0;
        border-radius: 8px;
        background: none;
        color: var(--muted);
        font-size: 22px;
        line-height: 1;
        cursor: pointer;
      }
      .chat-close:hover,
      .chat-close:focus-visible {
        background: var(--hover);
        color: var(--text);
      }
      .chat-log {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 20px 16px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .msg {
        display: flex;
        align-items: flex-end;
        gap: 8px;
      }
      .msg.from-you {
        justify-content: flex-end;
      }
      .msg .bubble {
        min-width: 0;
        max-width: 85%;
        padding: 9px 13px;
        border-radius: 16px;
        font-size: 14px;
        line-height: 1.55;
        transition: box-shadow 0.15s;
      }
      .msg.from-you .bubble {
        background: var(--ask-bg);
        border-bottom-right-radius: 4px;
      }
      .msg.from-planner .bubble {
        background: var(--raised);
        border: 1px solid var(--line);
        border-bottom-left-radius: 4px;
      }
      .msg.is-lit .bubble,
      .msg.is-flash .bubble {
        box-shadow: 0 0 0 2px var(--ask-fg);
      }
      .msg .bubble .desc > * + * {
        margin-top: 6px;
      }
      .msg .bubble .desc ul,
      .msg .bubble .desc ol {
        margin: 0;
        padding-left: 18px;
      }
      .msg .bubble .desc li + li {
        margin-top: 3px;
      }
      .avatar {
        flex: none;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--target);
        color: var(--focus);
      }
      .msg-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 10px;
        margin-top: 4px;
        font-size: 11px;
        color: var(--quiet);
      }
      .msg-meta .link-button {
        visibility: hidden;
        font-size: 11px;
      }
      .msg:hover .msg-meta .link-button,
      .msg-meta .link-button:focus-visible {
        visibility: visible;
      }
      /* In a feature's chat, a note about one of its tickets names it: a link to its card. */
      .msg-about {
        display: block;
        width: fit-content;
        margin: 0 0 4px;
        font:
          500 11.5px/16px 'IBM Plex Mono',
          ui-monospace,
          monospace;
        color: var(--quiet);
        text-decoration: none;
      }
      .msg-about:hover {
        color: var(--link);
        text-decoration: underline;
      }
      .msg-quote {
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
        width: 100%;
        margin: 0 0 6px;
        padding: 1px 0 1px 9px;
        border: 0;
        border-left: 2px solid var(--quiet);
        background: none;
        color: var(--muted);
        font: inherit;
        font-size: 12.5px;
        text-align: left;
        cursor: pointer;
      }
      .msg-quote .lost {
        font-style: italic;
        color: var(--quiet);
      }
      .chat-fold {
        align-self: center;
        padding: 2px 12px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: none;
        color: var(--muted);
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      .chat-fold:hover {
        color: var(--text);
        border-color: var(--quiet);
      }
      .chat-divider {
        align-self: stretch;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 11.5px;
        color: var(--quiet);
      }
      .chat-divider::before,
      .chat-divider::after {
        content: '';
        flex: 1;
        border-top: 1px solid var(--line);
      }
      .chat .msg > .choice {
        flex: 1;
        min-width: 0;
        margin: 0;
        padding: 12px 14px;
        border-bottom-left-radius: 4px;
      }
      .chat .choice .qctx,
      .chat .choice .opts,
      .chat .choice .thread,
      .chat .choice .form-actions {
        margin-left: 0;
      }
      .chat-empty {
        margin: auto;
        max-width: 340px;
        text-align: center;
        font-size: 13.5px;
        color: var(--muted);
      }
      .typing .bubble {
        color: var(--muted);
        font-size: 13px;
      }
      .dots {
        display: inline-flex;
        gap: 3px;
        margin-right: 8px;
        vertical-align: middle;
      }
      .dots i {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        animation: blink 1.2s infinite ease-in-out;
      }
      .dots i:nth-child(2) {
        animation-delay: 0.2s;
      }
      .dots i:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes blink {
        0%,
        80%,
        100% {
          opacity: 0.25;
        }
        40% {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .dots i,
        .chat-state.is-working .dot {
          animation: none;
        }
      }
      .chat-compose {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 6px 8px;
        align-items: end;
        padding: 10px 12px 12px;
        border-top: 1px solid var(--line);
      }
      .chat-quote {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 2px 4px 2px 9px;
        border-left: 2px solid var(--ask-fg);
        font-size: 12.5px;
        color: var(--muted);
      }
      .chat-quote[hidden] {
        display: none;
      }
      .chat-quote .what {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .chat-quote button {
        border: 0;
        background: none;
        color: var(--muted);
        font-size: 16px;
        line-height: 1;
        cursor: pointer;
      }
      #chat-input {
        display: block;
        width: 100%;
        min-height: 42px;
        max-height: 220px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--raised);
        color: var(--text);
        font: inherit;
        font-size: 14px;
        line-height: 20px;
        resize: none;
      }
      #chat-input:focus {
        outline: 2px solid var(--focus);
        outline-offset: -1px;
      }
      .chat-send {
        height: 42px;
        padding: 0 18px;
        border: 0;
        border-radius: 14px;
        background: var(--focus);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .chat-send:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .chat-hint {
        grid-column: 1 / -1;
        font-size: 11px;
        color: var(--quiet);
      }
      .act.chat-open {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        position: relative;
      }
      .act.chat-open.is-open {
        border-color: var(--focus);
        color: var(--text);
      }
      .act.chat-open.has-new::after {
        content: '';
        position: absolute;
        top: -2px;
        right: -2px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--focus);
      }
      button.chip {
        border: 0;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      mark.quote-mark {
        background: var(--ask-bg);
        color: inherit;
        border-bottom: 2px solid var(--ask-fg);
        border-radius: 2px;
        cursor: pointer;
      }
      mark.quote-mark.is-closed {
        background: none;
        border-bottom: 1px dotted var(--quiet);
      }
      mark.quote-mark.is-draft {
        border-bottom-style: dashed;
      }
      mark.quote-mark.is-lit {
        background: var(--ask-fg);
        color: var(--page);
      }
      .quote-button {
        position: fixed;
        z-index: 20;
        padding: 4px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--raised);
        box-shadow: 0 2px 8px rgb(0 0 0 / 0.15);
        color: var(--text);
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .quote-button[hidden] {
        display: none;
      }
      .note {
        padding: 8px 12px;
        border-left: 3px solid var(--ask-fg);
        border-radius: 0 8px 8px 0;
        background: var(--ask-bg);
        font-size: 13.5px;
        color: var(--text);
      }
      .note .desc > p {
        margin: 0;
      }
      /* The planner's replies: its own colour, so a thread reads as two voices. */
      .note.by-claude {
        border-left-color: var(--focus);
        background: var(--target);
      }
      .note-meta .who {
        font-weight: 600;
        color: var(--text);
      }
      .note-meta .unread {
        color: var(--ask-fg);
        font-weight: 600;
      }
      .choice .thread {
        margin: 10px 0 0 32px;
      }
      /* The agents (planner, builder, workers): what each is doing, in a bar at the top of every
         page that takes its own room, so it covers nothing. */
      .agents {
        flex: none;
        position: sticky;
        top: 0;
        z-index: 15;
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 0;
        padding: 6px clamp(16px, 3vw, 40px);
        overflow-x: auto;
        scrollbar-width: thin;
        list-style: none;
        background: var(--page);
        border-bottom: 1px solid var(--line);
      }

      .agent {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        max-width: 100%;
        padding: 2px 10px;
        border: 1px solid var(--line);
        flex: none;
        max-width: 460px;
        border-radius: 999px;
        background: var(--raised);
        font-size: 12px;
        line-height: 20px;
        color: var(--muted);
      }
      .agent .what {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: inherit;
        text-decoration: none;
      }
      .agent a.what:hover {
        text-decoration: underline;
      }
      .agent .dot {
        flex: none;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--quiet);
      }
      .agent .forget {
        flex: none;
        margin: 0 -4px 0 2px;
        padding: 0 2px;
        border: 0;
        background: none;
        color: inherit;
        font: inherit;
        font-size: 14px;
        line-height: 1;
        cursor: pointer;
        opacity: 0.7;
      }
      .agent .forget:hover {
        opacity: 1;
      }
      .agent.is-listening .dot,
      .agent.is-done .dot {
        background: var(--done-fg);
      }
      .agent.is-working {
        color: var(--text);
      }
      .agent.is-working .dot {
        background: var(--ask-fg);
        animation: pulse 1.2s ease-in-out infinite;
      }
      .agent.is-off.has-waiting {
        border-color: var(--ask-fg);
        color: var(--ask-fg);
      }
      .agent.is-abandoned {
        border-color: var(--waiting-fg);
        background: var(--waiting-bg);
        color: var(--waiting-fg);
      }
      .agent.is-abandoned .dot {
        background: var(--waiting-fg);
      }
      @keyframes pulse {
        50% {
          opacity: 0.3;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .agent.is-working .dot {
          animation: none;
        }
      }
      .s-working {
        background: var(--progress-bg);
        color: var(--progress-fg);
      }
      .s-abandoned {
        background: var(--waiting-bg);
        color: var(--waiting-fg);
        box-shadow: inset 0 0 0 1px var(--waiting-fg);
      }
      .note-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 4px;
        font-size: 11.5px;
        color: var(--muted);
      }
      .link-button {
        border: 0;
        padding: 0;
        background: none;
        color: var(--link);
        font: inherit;
        cursor: pointer;
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .note-form textarea,
      .choice textarea {
        display: block;
        width: 100%;
        min-height: 64px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--raised);
        color: var(--text);
        font: inherit;
        font-size: 13.5px;
        resize: vertical;
      }
      .form-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
      }
      .form-actions .hint {
        font-size: 11.5px;
        color: var(--quiet);
      }
      /* Your decisions: a feature's open questions, each answered here. */
      .decisions .choice {
        padding: 14px 16px;
      }
      .decisions .choice + .choice {
        margin-top: 10px;
      }
      .choice.is-answered {
        border-color: var(--chosen-line);
      }
      .choice .q {
        display: flex;
        gap: 10px;
        margin: 0;
        font-weight: 600;
        line-height: 22px;
      }
      .choice .qn {
        flex: none;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--ask-bg);
        color: var(--ask-fg);
        font:
          600 12px/22px 'IBM Plex Mono',
          ui-monospace,
          monospace;
        text-align: center;
      }
      .choice.is-answered .qn {
        background: var(--done-bg);
        color: var(--done-fg);
      }
      .choice .qctx {
        margin: 6px 0 0 32px;
        font-size: 13.5px;
        line-height: 1.55;
        color: var(--text);
      }
      .qctx ul,
      .qctx ol,
      .note .desc ul,
      .note .desc ol {
        margin: 0;
        padding-left: 18px;
      }
      .qctx li + li,
      .note .desc li + li {
        margin-top: 4px;
      }
      .qctx li > ul,
      .note .desc li > ul {
        margin-top: 4px;
      }
      .note .desc > * + * {
        margin-top: 6px;
      }
      .opts {
        margin: 10px 0 0 32px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .opt {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 8px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        cursor: pointer;
        font-size: 13.5px;
      }
      .opt:hover {
        border-color: var(--focus);
      }
      .opt:has(input:checked) {
        border-color: var(--focus);
        background: var(--target);
      }
      .opt input {
        margin: 3px 0 0;
        accent-color: var(--focus);
      }
      .rec {
        margin-left: 6px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--done-fg);
        white-space: nowrap;
      }
      .opt textarea {
        margin-top: 6px;
        min-height: 52px;
      }
      .opt .grow {
        flex: 1;
        min-width: 0;
      }
      .choice .form-actions {
        margin-left: 32px;
      }
      .pager {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 36px;
      }
      .pager a {
        display: block;
        padding: 12px 16px;
        color: inherit;
        text-decoration: none;
      }
      .pager a:hover {
        background: var(--hover);
      }
      .pager .next {
        text-align: right;
        grid-column: 2;
      }
      .pager small {
        display: block;
        font-size: 12px;
        color: var(--quiet);
      }
      .pager span {
        font-weight: 600;
      }
      @media (max-width: 640px) {
        .row {
          grid-template-columns: 44px minmax(0, 1fr);
        }
        .row .side {
          grid-column: 2;
          flex-direction: row;
          flex-wrap: wrap;
          align-items: center;
          justify-content: flex-start;
        }
        .row .side .chips {
          justify-content: flex-start;
        }
        .epic-head .progress {
          margin-left: 0;
        }
        .thead,
        .sub > .thead {
          grid-template-columns: 18px minmax(0, 1fr);
        }
        .thead > .id {
          grid-column: 2;
          line-height: 18px;
        }
        .thead > .title,
        .thead > .actions {
          grid-column: 2;
        }
        .thead > .actions {
          justify-content: flex-start;
          margin-top: 6px;
        }
        .tbody,
        .sub > .tbody {
          margin-left: 30px;
        }
        .opts,
        .choice .qctx,
        .choice .thread,
        .choice .form-actions {
          margin-left: 0;
        }
        .pager {
          grid-template-columns: 1fr;
        }
        .pager .next {
          grid-column: 1;
        }
      }
      .project {
        margin-top: 44px;
      }
      .project:first-child {
        margin-top: 28px;
      }
      .project-head {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 12px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--line);
      }
      .project-head h2 {
        margin: 0;
        font-size: 20px;
        line-height: 28px;
        font-weight: 600;
      }
      .project-head .prefix {
        font:
          500 13px/28px 'IBM Plex Mono',
          ui-monospace,
          monospace;
        color: var(--quiet);
        text-decoration: none;
      }
      .project-head .n {
        font-size: 12px;
        color: var(--quiet);
      }
      .project-head .progress {
        margin-left: auto;
      }
      .intro {
        margin: 10px 0 0;
        font-size: 13.5px;
        color: var(--muted);
        max-width: 76ch;
      }
      .intro p {
        margin: 6px 0 0;
      }
      .intro ul {
        margin: 4px 0 0;
        padding-left: 20px;
      }
      .status-note {
        margin: 8px 0 0;
        font-size: 13px;
        color: var(--muted);
      }
      .yours {
        margin-left: 8px;
        font:
          500 11px/18px 'IBM Plex Sans',
          system-ui,
          sans-serif;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--waiting-fg);
      }
      .s-approved {
        background: var(--done-bg);
        color: var(--done-fg);
      }
      .approved-n {
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
      }
      .approve {
        flex: none;
        height: 24px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--raised);
        color: var(--muted);
        font:
          500 12px/22px 'IBM Plex Sans',
          system-ui,
          sans-serif;
        cursor: pointer;
        white-space: nowrap;
      }
      .approve:hover {
        border-color: var(--focus);
        color: var(--text);
      }
      .approve[aria-pressed='true'] {
        background: var(--done-bg);
        border-color: transparent;
        color: var(--done-fg);
      }
      .approve:disabled {
        opacity: 0.6;
        cursor: progress;
      }
      .epic-head .approve {
        margin-left: 4px;
      }
      /* Approved, but what it waits on isn't done: it's built after. */
      .s-held {
        background: var(--waiting-bg);
        color: var(--waiting-fg);
        box-shadow: inset 0 0 0 1.5px var(--waiting-fg);
      }
      .tt .chip {
        margin-left: 8px;
        vertical-align: 1px;
      }
      .chip a {
        color: inherit;
      }
      /* Waits on / Blocks: a label, then its items, one row each. */
      .deps {
        display: grid;
        grid-template-columns: max-content minmax(0, 1fr);
        gap: 4px 12px;
        margin-top: 10px;
        font-size: 12.5px;
        line-height: 20px;
        color: var(--muted);
      }
      .deps-label {
        font-size: 11px;

      .deps ul {
        margin: 0;

      .deps .ids {

      .deps a {

        color: var(--done-fg);

      .deps .gone {

        color: var(--waiting-fg);
      }
      .notice {
        position: fixed;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        width: min(640px, calc(100% - 32px));
        box-sizing: border-box;
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 12px 12px 12px 16px;
        border-radius: 8px;
        background: var(--waiting-bg);

        box-shadow: 0 6px 16px rgba(28, 26, 20, 0.16);

      }

    </style>
  </head>
  <body>
    <ul class="agents" id="agents" role="status" aria-label="Agents"></ul>
    <div class="workspace">
      <main id="main">
        <section id="list-view">
          <div class="top">
            <h1>Tasks</h1>
            <span class="updated" id="updated">Reading tasks/…</span>
          </div>
          <p class="totals" id="totals"></p>
          <div class="filters places" id="projects" aria-label="Project"></div>
          <div class="bar">
            <label
              for="find"
              style="
                position: absolute;
                width: 1px;
                height: 1px;
                overflow: hidden;
                clip: rect(0 0 0 0);
              "
              >Find a feature, ticket or subticket</label
            >
            <input id="find" type="search" placeholder="Find by id, title or text" />
            <div class="filters" id="filters"></div>
          </div>
          <div class="filters places" id="places" aria-label="Where"></div>
          <div id="groups"></div>
        </section>
        <section id="detail-view" hidden></section>
        <div id="error" class="error" hidden></div>
        <div id="notice" class="notice" role="status" hidden>
          <div class="text"></div>
          <button type="button" aria-label="Close">×</button>
        </div>
      </main>
      <aside class="chat" id="chat" aria-label="Notes" hidden>
        <header class="chat-head">
          <div class="chat-title" id="chat-title"></div>
          <span class="chat-state" id="chat-state"></span>
          <button
            type="button"
            class="chat-close"
            data-act="chat-close"
            aria-label="Close the notes"
            title="Close (Esc)"
          >
            ×
          </button>
        </header>
        <div class="chat-log" id="chat-log" role="log" aria-live="polite"></div>
        <div class="chat-compose">
          <div class="chat-quote" id="chat-quote" hidden></div>
          <textarea id="chat-input" rows="1" aria-label="Write a note"></textarea>
          <button type="button" class="chat-send" id="chat-send" data-act="note">Send</button>
          <span class="chat-hint"
            >Enter sends · Shift+Enter starts a new line · select text on the left to note on
            it</span
          >
        </div>
      </aside>
    </div>
    <script>
      // The task viewer: every tasks/*.json (served together as /tasks.json by
      // scripts/tasks-view.mjs), in the shape tasks/tasks.schema.json gives. A file
      // is a project (tickets, gateway, bh…): epics, features, a feature's plan of
      // tickets, a ticket's subtickets. Addresses: "#" every project; "#GW" one
      // project; "#GW/E1" an epic (the list, scrolled to it); "#GW-3" a feature;
      // "#GW-3.2" a ticket; "#GW-3.2.1" a subticket. Approve marks an item approved
      // and Cancel cancelled (POST /edit writes it to its file); an item with children
      // is approved when all of them are, and approving it approves them all. Notes and
      // the answers to a feature's questions are written the same way.
      const KINDS = [
        ['done', 'Done'],
        ['progress', 'In progress'],
        ['designed', 'Designed'],
        ['planned', 'Planned'],
        ['planning', 'Planning'],
        ['none', 'Not planned'],
      ];
      const KIND_OF = Object.fromEntries(KINDS.map(([kind, label]) => [label, kind]));
      const CROSS =
        '<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M3 3l4 4M7 3 3 7" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>';
      const CHECK =
        '<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 5.2 4.1 7.3 8 3" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      const SECTIONS = [
        ['today', 'Today'],
        ['stays', 'Stays'],
        ['rule', 'Rule'],
        ['design', 'Design'],
      ];
      const state = {
        raw: null,
        docs: [],
        byId: new Map(),
        project: null,
        filter: null,
        place: null,
        find: '',
        listScroll: 0,
        // What's typed but not saved, by field ("note:TK-3", "pick:TK-11:0", "other:TK-11:0"),
        // so a re-read of the files never wipes it.
        drafts: {},
        // The item whose notes are open in the chat, the fragment the next note quotes
        // ({quote, nth} or null), whether its resolved notes show, and what the chat last drew.
        chat: null,
        chatQuote: null,
        chatAbout: null,
        chatResolved: false,
        chatDrawn: '',
        chatStick: false,
        // What each agent last said (GET /agents), and how many of your words wait for the planner.
        agents: [],
        waiting: 0,
        // Which item each worker shows on, and as what, as last drawn on the cards.
        workKey: '',
      };

      function escape(s) {
        return String(s).replace(
          /[&<>"']/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
        );
      }

      /** Markdown's inline parts: code, bold, italics, links; a known id links to its page. `plain` drops links, for text inside a link. */
      function inline(s, plain = false) {
        const codes = [];
        let out = escape(s ?? '').replace(
          /`([^`]+)`/g,
          (_, code) => `\u0000${codes.push(code) - 1}\u0000`,
        );
        out = out
          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          .replace(/(^|[\s(])_([^_]+)_(?=[\s.,;:)]|$)/g, '$1<em>$2</em>');
        out = plain
          ? out.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '$1')
          : out
              .replace(
                /\[([^\]]+)\]\((https?:[^)\s]+)\)/g,
                '<a href="$2" target="_blank" rel="noreferrer">$1</a>',
              )
              .replace(
                /(^|[\s(])(https?:\/\/[^\s<)]+)/g,
                '$1<a href="$2" target="_blank" rel="noreferrer">$2</a>',
              )
              .replace(/\b[A-Z]+-\d+(?:\.\d+)*\b/g, (id) =>
                state.byId.has(id) ? `<a href="#${id}">${id}</a>` : id,
              );
        return out.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[Number(i)]}</code>`);
      }
      function list(items) {
        if (!items?.length) return '';
        return `<ul>${items.map((i) => (typeof i === 'string' ? `<li>${inline(i)}</li>` : `<li>${inline(i.text)}${list(i.items)}</li>`)).join('')}</ul>`;
      }
      /** A block: a paragraph, a list, or a paragraph and its list. */
      function block(b) {
        if (typeof b === 'string') return `<p>${inline(b)}</p>`;
        if (Array.isArray(b)) return list(b);
        return `<p>${inline(b.text)}</p>${list(b.items)}`;
      }
      /**
       * One stretch of text between blank lines: its lines of text make paragraphs, and its `- `,
       * `* ` or `1. ` lines make lists, nested by indenting two spaces; an indented line goes on
       * the item before it.
       */
      function blocksHtml(chunk) {
        let out = '';
        let para = [];
        let items = null;
        const flushPara = () => {
          if (para.length) out += `<p>${inline(para.join(' '))}</p>`;
          para = [];
        };
        const flushList = () => {
          if (!items) return;
          const tag = items.ordered ? 'ol' : 'ul';
          out += `<${tag}>${items.list.map((i) => `<li>${inline(i.text)}${i.sub.length ? `<ul>${i.sub.map((x) => `<li>${inline(x)}</li>`).join('')}</ul>` : ''}</li>`).join('')}</${tag}>`;
          items = null;
        };
        for (const line of chunk.split('\n')) {
          const item = /^(\s*)([-*]|\d+[.)])\s+(.*)$/.exec(line);
          if (item) {
            flushPara();
            const ordered = /\d/.test(item[2]);
            const last = items?.list[items.list.length - 1];
            if (item[1].length >= 2 && last) last.sub.push(item[3]);
            else {
              if (!items || items.ordered !== ordered) {
                flushList();
                items = { ordered, list: [] };
              }
              items.list.push({ text: item[3], sub: [] });
            }
          } else if (items && /^\s{2,}\S/.test(line)) {
            const last = items.list[items.list.length - 1];
            if (last.sub.length) last.sub[last.sub.length - 1] += ` ${line.trim()}`;
            else last.text += ` ${line.trim()}`;
          } else {
            flushList();
            para.push(line.trim());
          }
        }
        flushPara();
        flushList();
        return out;
      }
      /** A description: paragraphs with a blank line between, lists, and ``` fenced code shown as written. */
      function rich(s) {
        return String(s ?? '')
          .split(/^```([^\n]*)\n([\s\S]*?)\n```$/m)
          .map((part, i, parts) =>
            i % 3 === 1
              ? ''
              : i % 3 === 2
                ? `<pre><code>${codeHtml(part, parts[i - 1].trim())}</code></pre>`
                : part
                    .split(/\n\s*\n/)
                    .map((p) => p.trim())
                    .filter(Boolean)
                    .map(blocksHtml)
                    .join(''),
          )
          .join('');
      }
      /** The tokens of TypeScript, JSON and a route list (```http); each group is one colour. */
      const CODE_TOKENS = new RegExp(
        [
          String.raw`(\/\*[\s\S]*?\*\/|\/\/[^\n]*)`, // a comment
          String.raw`("(?:[^"\\\n]|\\.)*")(?=\s*:)`, // a JSON key
          String.raw`('(?:[^'\\\n]|\\.)*'|"(?:[^"\\\n]|\\.)*")`, // a string
          String.raw`\b(interface|type|const|export|declare|function|import|from|extends|as|GET|POST|PATCH|PUT|DELETE)\b`,
          String.raw`\b(string|number|boolean|unknown|never|undefined|void)\b`, // a built-in type
          String.raw`\b(true|false|null|\d+(?:\.\d+)?)\b`, // a literal
          String.raw`\b([A-Z][\w]*[a-z][\w]*|[A-Z])\b`, // a named type: Query, V (not OPERATORS)
          String.raw`([A-Za-z_$][\w$]*)(?=\??:)`, // a key
          String.raw`\b([A-Z]+-\d+(?:\.\d+)*)\b`, // an id: TK-11.2, a link when it's known
        ].join('|'),
        'g',
      );
      const CODE_CLASSES = [null, 'cm', 'pr', 'st', 'kw', 'ty', 'nu', 'ty', 'pr', 'id'];
      /** Code as written, highlighted when its fence names ts, json or http. */
      function codeHtml(code, lang) {
        if (!['ts', 'json', 'http'].includes(lang)) return escape(code);
        let out = '';
        let at = 0;
        for (const m of code.matchAll(CODE_TOKENS)) {
          const kind = CODE_CLASSES[m.findIndex((g, i) => i > 0 && g !== undefined)];
          const token =
            kind !== 'id'
              ? `<span class="${kind}">${escape(m[0])}</span>`
              : state.byId.has(m[0])
                ? `<a href="#${m[0]}">${m[0]}</a>`
                : m[0];
          out += escape(code.slice(at, m.index)) + token;
          at = m.index + m[0].length;
        }
        return out + escape(code.slice(at));
      }
      /** A description's first paragraph, for a one-line summary. */
      const lead = (s) => String(s ?? '').split(/\n\s*\n|```/)[0];
      const blockText = (b) => (typeof b === 'string' ? b : JSON.stringify(b));

      /** The served files → projects with links between their parts (each item's `parent`), every id, and who waits on what. */
      function build(files) {
        state.byId = new Map();
        state.epics = new Map();
        const ticket = (t, feature, parent) => {
          const out = { ...t, feature, parent };
          out.subs = (t.subtickets ?? []).map((s) => ticket(s, feature, out));
          state.byId.set(t.id, out);
          return out;
        };
        const docs = files.map((doc) => {
          doc.features = [];
          for (const epic of doc.epics) {
            epic.doc = doc;
            epic.ref = `${doc.prefix}/${epic.id}`;
            state.epics.set(epic.ref, epic);
            for (const f of epic.features) {
              f.epic = epic;
              f.doc = doc;
              f.parent = epic;
              f.tasks = (f.plan ?? []).map((t) => ticket(t, f, f));
              doc.features.push(f);
              state.byId.set(f.id, f);
            }
          }
          return doc;
        });
        // The other way round: every item that waits on an item, for its "Blocks" line.
        state.blocks = new Map();
        const note = (x) => {
          for (const b of x.blockedBy ?? [])
            state.blocks.set(b.id, [...(state.blocks.get(b.id) ?? []), x]);
          for (const c of childrenOf(x)) note(c);
        };
        for (const doc of docs) for (const epic of doc.epics) note(epic);
        return docs;
      }

      const itemOf = (id) => state.byId.get(id) ?? state.epics.get(id);
      /** An item's address: its id, or "TK/E4" for an epic. */
      const refOf = (x) => x.ref ?? x.id;
      /** Done: a ticket's tick, a feature's Done, an epic whose features all are. */
      function doneOf(x) {
        if (x.ref) return x.features.every((f) => f.status === 'Done');
        if (x.status) return x.status === 'Done';
        return x.done === true;
      }
      /** What it waits on that isn't done yet: its own `blockedBy`, then its parents', each once. */
      function waitsOf(x) {
        const out = [];
        for (let at = x; at; at = at.parent)
          for (const b of at.blockedBy ?? []) {
            const item = itemOf(b.id);
            if (item && !doneOf(item) && !out.some((o) => o.id === b.id))
              out.push({ ...b, via: at === x ? null : at });
          }
        return out;
      }
      /** The items under it (or it) that are approved but can't be built yet. */
      function heldOf(x) {
        return leavesOf(x).filter(
          (l) => l.approved === true && l.cancelled !== true && !doneOf(l) && waitsOf(l).length,
        );
      }
      /**
       * "Waits on TK-2.2", or "Approved, waits on …" once approved; `links` false inside a link.
       * `above`: ids the page shows already (a ticket's feature's), named only in the tooltip; an
       * approved item that waits on nothing else still says "Approved, waiting".
       */
      function waitsChip(x, links = true, above = []) {
        const waits = doneOf(x) ? [] : waitsOf(x);
        if (!waits.length) return '';
        const held = approvedOf(x);
        const own = waits.filter((w) => !above.includes(w.id));
        if (!own.length && !held) return '';
        const names = own.map((w) => (links ? `<a href="#${w.id}">${w.id}</a>` : w.id));
        const list =
          names.slice(0, 3).join(', ') + (names.length > 3 ? ` +${names.length - 3}` : '');
        const title = waits
          .map((w) => `${w.id}: ${w.why}${w.via ? ` (through ${refOf(w.via)})` : ''}`)
          .join('\n');
        const text = own.length
          ? `${held ? 'Approved, waits on' : 'Waits on'} ${list}`
          : 'Approved, waiting';
        return `<span class="chip ${held ? 's-held' : 's-waiting'}" title="${escape(title)}">${text}</span>`;
      }
      /** An item's own blockers with why (struck when done), and the items that wait on it. */
      function depsHtml(x) {
        const own = x.blockedBy ?? [];
        const blocks = state.blocks.get(refOf(x)) ?? [];
        if (!own.length && !blocks.length) return '';
        const row = (b) => {
          const item = itemOf(b.id);
          const met = item && doneOf(item);
          const gone = item && !met && cancelledOf(item);
          return `<li${met ? ' class="is-met"' : ''}><a href="#${b.id}">${b.id}</a> ${inline(b.why)}${met ? ' <span class="met">done</span>' : ''}${gone ? ' <span class="gone">cancelled</span>' : ''}</li>`;
        };
        return `<div class="deps">${own.length ? `<span class="deps-label">Waits on</span><ul>${own.map(row).join('')}</ul>` : ''}${blocks.length ? `<span class="deps-label">Blocks</span><span class="ids">${blocks.map((y) => `<a href="#${refOf(y)}">${refOf(y)}</a>`).join('')}</span>` : ''}</div>`;
      }
      const when = (at) =>
        new Date(at).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
      /** One note: yours (and whether the planner has read it) or the planner's reply. */
      function noteHtml(n, id) {
        const mine = n.by !== 'claude';
        const read = mine
          ? n.seen
            ? `<span>Read by the planner ${escape(when(n.seen))}</span>`
            : '<span class="unread">Not read yet</span>'
          : '';
        const remove = id
          ? `<button type="button" class="link-button" data-act="unnote" data-id="${escape(id)}" data-at="${escape(n.at)}">Delete</button>`
          : '';
        return `<div class="note${mine ? '' : ' by-claude'}"><div class="desc">${rich(n.text)}</div><div class="note-meta"><span class="who">${mine ? 'You' : 'Planner'}</span><span>${escape(when(n.at))}</span>${read}${remove}</div></div>`;
      }
      /** A quoted fragment's key: `nth:quote`; '' for a note on the whole item. */
      const threadKey = (q) => (q?.quote ? `${q.nth ?? 0}:${q.quote}` : '');
      const CHAT_ICON =
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';
      const PLANNER_ICON =
        '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l2.2 6.3L20.5 10l-6.3 2.2L12 18.5l-2.2-6.3L3.5 10l6.3-1.7z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/></svg>';
      /** When you last looked at each item's notes, so a reply since shows a dot (kept in this browser). */
      const seenReplies = (() => {
        try {
          return JSON.parse(localStorage.getItem('tasks-chat-seen') ?? '{}');
        } catch {
          return {};
        }
      })();
      const newReplyOf = (x) =>
        (x.notes ?? []).some((n) => n.by === 'claude' && n.at > (seenReplies[refOf(x)] ?? ''));
      function markRepliesSeen(x) {
        const last = (x.notes ?? [])
          .map((n) => n.at)
          .sort()
          .pop();
        if (!last || seenReplies[refOf(x)] === last) return;
        seenReplies[refOf(x)] = last;
        try {
          localStorage.setItem('tasks-chat-seen', JSON.stringify(seenReplies));
        } catch {
          // a private window keeps no record; the dot just shows again
        }
      }
      /** The feature whose chat an item's notes are in: a ticket's, or the feature itself. */
      const chatOf = (x) => x.feature ?? x;
      /** What a feature's chat holds the notes of: the feature, its tickets, their subtickets. */
      function chatItemsOf(f) {
        const walk = (t) => [t, ...t.subs.flatMap(walk)];
        return [f, ...(f.tasks ?? []).flatMap(walk)];
      }
      /**
       * An item's Notes button, which opens its feature's chat about it: how many notes (a feature's
       * counts its tickets'), a dot for a reply you haven't seen.
       */
      function chatButton(x) {
        const id = refOf(x);
        const f = chatOf(x);
        const items = x === f ? chatItemsOf(f) : [x];
        const n = items.reduce((k, y) => k + (y.notes ?? []).length, 0);
        const inChat = state.chat === refOf(f);
        const open = inChat && state.chatAbout === id ? ' is-open' : '';
        const fresh = !inChat && items.some(newReplyOf) ? ' has-new' : '';
        const title = x === f ? `The chat on ${id} and its tickets` : `Notes on ${id}, in ${refOf(f)}'s chat`;
        return `<button type="button" class="act chat-open${open}${fresh}" data-act="chat-open" data-id="${escape(id)}" title="${escape(title)}${fresh ? ': the planner replied' : ''}">${CHAT_ICON}<span>${n ? `Notes · ${n}` : 'Notes'}</span></button>`;
      }
      /**
       * One message: yours on the right, the planner's on the left with its mark; one about a ticket
       * (not the chat's feature) names it.
       */
      function messageHtml(n, id, chatId) {
        const mine = n.by !== 'claude';
        const key = `${id}|${threadKey(n)}`;
        const about =
          id !== chatId
            ? `<a class="msg-about" href="#${escape(id)}" title="${escape(itemOf(id)?.title.replace(/`/g, '') ?? id)}">${escape(id)}</a>`
            : '';
        const quote = n.quote
          ? `<button type="button" class="msg-quote" data-act="chat-mark" data-key="${escape(key)}" title="Show it in the description">${escape(n.quote)}</button>`
          : '';
        const who = mine ? (n.seen ? 'Read by the planner' : 'Sent') : 'Planner';
        const reply = `<button type="button" class="link-button" data-act="chat-reply" data-id="${escape(id)}"${n.quote ? ` data-quote="${escape(n.quote)}" data-nth="${n.nth ?? 0}"` : ''}>Reply</button>`;
        const remove = `<button type="button" class="link-button" data-act="unnote" data-id="${escape(id)}" data-at="${escape(n.at)}">Delete</button>`;
        const bubble = `<div class="bubble">${about}${quote}<div class="desc">${rich(n.text)}</div><div class="msg-meta"><span>${escape(who)} · ${escape(when(n.at))}</span>${reply}${remove}</div></div>`;
        return `<div class="msg ${mine ? 'from-you' : 'from-planner'}" data-key="${escape(key)}">${mine ? '' : `<span class="avatar" title="Planner">${PLANNER_ICON}</span>`}${bubble}</div>`;
      }
      /** The chat's state line and its "thinking" bubble, from what the planner last said. */
      function plannerNow() {
        const planner = state.agents.find((a) => a.role === 'planner');
        return planner ? agentView(planner) : { kind: 'is-off', label: 'Planner not running' };
      }
      /**
       * What a feature's chat shows: your notes and the planner's replies on it and on its tickets,
       * in time order, then its questions.
       */
      function chatLogHtml(x) {
        const id = refOf(x);
        const of = new Map();
        const notes = chatItemsOf(x)
          .flatMap((y) => (y.notes ?? []).map((n) => (of.set(n, refOf(y)), n)))
          .sort((a, b) => a.at.localeCompare(b.at));
        const message = (n) => messageHtml(n, of.get(n), id);
        const resolved = notes.filter((n) => n.closed);
        const open = notes.filter((n) => !n.closed);
        const asks = (x.openChoices ?? []).map((c, i) => [c, i]);
        let out = '';
        if (resolved.length)
          out += state.chatResolved
            ? `<button type="button" class="chat-fold" data-act="chat-fold">Hide ${resolved.length} resolved</button>${resolved.map(message).join('')}<div class="chat-divider">resolved</div>`
            : `<button type="button" class="chat-fold" data-act="chat-fold">▸ ${resolved.length} resolved ${resolved.length === 1 ? 'note' : 'notes'}</button>`;
        out += open.map(message).join('');
        if (asks.length)
          out += `<div class="chat-divider">${asks.length === 1 ? 'a question for you' : `${asks.length} questions for you`}</div>${asks.map(([c, i]) => `<div class="msg from-planner"><span class="avatar" title="Planner">${PLANNER_ICON}</span>${choiceHtml(x, c, i)}</div>`).join('')}`;
        const waiting =
          notes.some((n) => n.by !== 'claude' && !n.seen) || asks.some(([c]) => c.answer);
        if (waiting) {
          const now = plannerNow();
          const text =
            now.kind === 'is-working'
              ? 'The planner is working on it…'
              : now.kind === 'is-listening'
                ? 'The planner reads it in a moment…'
                : "The planner isn't running: it reads this when it starts.";
          out += `<div class="msg from-planner typing"><span class="avatar">${PLANNER_ICON}</span><div class="bubble">${now.kind === 'is-off' ? '' : '<span class="dots"><i></i><i></i><i></i></span>'}${escape(text)}</div></div>`;
        }
        if (!notes.length && !asks.length)
          out += `<p class="chat-empty">No notes on ${escape(id)} or its tickets yet. Ask, ask for a change, or leave a reminder for the builder: the planner replies here.</p>`;
        return out;
      }
      /** Draws the chat for the open item, or hides it; keeps your typing, and the scroll at the end. */
      function renderChat() {
        const box = document.getElementById('chat');
        const x = state.chat ? itemOf(state.chat) : null;
        document.body.classList.toggle('chat-open', Boolean(x));
        if (!x) {
          box.hidden = true;
          state.chatDrawn = '';
          return;
        }
        const id = state.chat;
        const switched = box.hidden || !state.chatDrawn.startsWith(`${id}\u0000`);
        box.hidden = false;
        const now = plannerNow();
        document.getElementById('chat-title').innerHTML =
          `<a class="chat-id" href="#${escape(id)}">${escape(id)}</a><span class="chat-name">${inline(x.title, true)}</span>`;
        const stateBox = document.getElementById('chat-state');
        stateBox.className = `chat-state ${now.kind}`;
        stateBox.innerHTML = `<span class="dot" aria-hidden="true"></span>${escape(now.kind === 'is-working' ? 'Planner working' : now.kind === 'is-listening' ? 'Planner listening' : 'Planner not running')}`;
        stateBox.title = now.label;
        // The composer stays as it is while you type; only its item and quote change.
        // One composer for the feature; the note goes on the item it's about (the feature, or the
        // ticket whose Notes you pressed), maybe on a fragment of its description.
        const input = document.getElementById('chat-input');
        const send = document.getElementById('chat-send');
        if (input.dataset.draft !== `note:${id}`) {
          input.dataset.draft = `note:${id}`;
          input.value = state.drafts[`note:${id}`] ?? '';
          growInput();
        }
        const about = state.chatAbout && itemOf(state.chatAbout) ? state.chatAbout : id;
        const quote = state.chatQuote;
        input.placeholder = quote
          ? `A note on the marked text${about === id ? '' : ` in ${about}`}…`
          : `A note on ${about}…`;
        send.dataset.id = about;
        send.disabled = false;
        const q = document.getElementById('chat-quote');
        q.hidden = !quote && about === id;
        q.innerHTML = q.hidden
          ? ''
          : `<span class="what">${quote ? `On “${escape(quote.quote)}”${about === id ? '' : ` in ${escape(about)}`}` : `About ${escape(about)} · ${inline(itemOf(about).title, true)}`}</span><button type="button" data-act="chat-unquote" aria-label="${quote ? 'Note on the whole item instead' : `Note on ${escape(id)} instead`}">×</button>`;
        // The log is drawn again only when what it shows changed.
        const drawn = `${id}\u0000${JSON.stringify([chatItemsOf(x).map((y) => y.notes), x.openChoices, now.kind, state.chatResolved, state.drafts])}`;
        if (drawn !== state.chatDrawn) {
          const log = document.getElementById('chat-log');
          const atEnd = log.scrollHeight - log.scrollTop - log.clientHeight < 48;
          const active = document.activeElement;
          const typing = log.contains(active) ? active.dataset.draft : null;
          const caret =
            typing && active.type !== 'radio' ? [active.selectionStart, active.selectionEnd] : null;
          const value = active?.type === 'radio' ? `[value="${CSS.escape(active.value)}"]` : '';
          const top = log.scrollTop;
          log.innerHTML = chatLogHtml(x);
          if (switched || atEnd || state.chatStick) log.scrollTop = log.scrollHeight;
          else log.scrollTop = top;
          state.chatStick = false;
          if (typing) {
            const field = log.querySelector(`[data-draft="${CSS.escape(typing)}"]${value}`);
            field?.focus({ preventScroll: true });
            if (field && caret) field.setSelectionRange(...caret);
          }
          state.chatDrawn = drawn;
        }
        for (const y of chatItemsOf(x)) markRepliesSeen(y);
      }
      /** The composer grows with what you write, up to its limit. */
      function growInput() {
        const input = document.getElementById('chat-input');
        input.style.height = 'auto';
        input.style.height = `${Math.min(input.scrollHeight + 2, 220)}px`;
      }
      /**
       * Opens the chat of an item's feature, about the item (maybe a fragment of its description),
       * and puts you in the composer.
       */
      function openChat(id, quote = null) {
        const x = itemOf(id);
        const chat = x ? refOf(chatOf(x)) : id;
        if (state.chat !== chat) state.chatResolved = false;
        state.chat = chat;
        state.chatAbout = id;
        state.chatQuote = quote;
        state.chatStick = true;
        render(false);
        document.getElementById('chat-input').focus({ preventScroll: true });
      }
      function closeChat() {
        state.chat = null;
        state.chatAbout = null;
        state.chatQuote = null;
        render(false);
      }

      /** What the form for question i holds before it's saved: an option's index, "other", or null. */
      function pickOf(f, i) {
        const c = f.openChoices[i];
        const key = `pick:${f.id}:${i}`;
        if (key in state.drafts) return state.drafts[key];
        if (!c.answer) return null;
        const k = c.options.indexOf(c.answer);
        return k >= 0 ? String(k) : 'other';
      }
      function otherOf(f, i) {
        const c = f.openChoices[i];
        const key = `other:${f.id}:${i}`;
        if (key in state.drafts) return state.drafts[key];
        return c.answer && !c.options.includes(c.answer) ? c.answer : '';
      }
      /** The answer the form for question i holds now, or "" when it holds none. */
      function draftAnswer(f, i) {
        const pick = pickOf(f, i);
        if (pick === null) return '';
        return pick === 'other' ? otherOf(f, i).trim() : f.openChoices[i].options[Number(pick)];
      }
      /** Saving is offered once the form holds an answer other than the saved one. */
      const canSave = (f, i) => {
        const draft = draftAnswer(f, i);
        return Boolean(draft) && draft !== (f.openChoices[i].answer ?? '');
      };
      /** One question: its options to pick from (the recommended one marked), or your own words. */
      function choiceHtml(f, c, i) {
        const pick = pickOf(f, i);
        const key = `${escape(f.id)}:${i}`;
        const radio = (value) =>
          `<input type="radio" name="q:${key}" value="${value}" data-draft="pick:${key}"${pick === value ? ' checked' : ''} />`;
        const options = c.options
          .map(
            (o, k) =>
              `<label class="opt">${radio(String(k))}<span class="grow">${inline(o)}${k === c.recommended ? '<span class="rec">Recommended</span>' : ''}</span></label>`,
          )
          .join('');
        const own = `<label class="opt">${radio('other')}<span class="grow">Your own answer<textarea data-draft="other:${key}" data-pick="pick:${key}" placeholder="Write it here" aria-label="Your own answer to question ${i + 1}">${escape(otherOf(f, i))}</textarea></span></label>`;
        const answered = c.answer
          ? `<span class="chip s-approved">Answered${c.answeredOn ? ` ${escape(c.answeredOn)}` : ''}</span>`
          : '';
        const takeBack = c.answer
          ? `<button type="button" class="act" data-act="unanswer" data-id="${escape(f.id)}" data-index="${i}">Take back</button>`
          : '';
        return `<div class="card choice${c.answer ? ' is-answered' : ''}" id="${escape(f.id)}-q${i + 1}" data-for="${escape(f.id)}" data-key="${escape(f.id)}|q:${i}">
          <p class="q"><span class="qn">${i + 1}</span><span>${inline(c.question)}</span></p>
          ${c.context ? `<div class="qctx desc">${rich(c.context)}</div>` : ''}
          ${c.notes?.length ? `<div class="notes thread">${c.notes.map((n) => noteHtml(n)).join('')}</div>` : ''}
          <div class="opts" role="radiogroup" aria-label="${escape(c.question.replace(/`/g, ''))}">${options}${own}</div>
          <div class="form-actions">${answered}<button type="button" class="approve" data-act="answer" data-id="${escape(f.id)}" data-index="${i}"${canSave(f, i) ? '' : ' disabled'}>${c.answer ? 'Change answer' : 'Save answer'}</button>${takeBack}</div>
        </div>`;
      }
      /** How many of a feature's questions wait for your answer. */
      const askedOf = (f) => (f.openChoices ?? []).filter((c) => !c.answer).length;
      function askChip(f) {
        const n = askedOf(f);
        return n
          ? `<span class="chip s-ask">${n} ${n === 1 ? 'question' : 'questions'}</span>`
          : '';
      }

      const KNOWN_REPOS = [
        'tickets',
        'bh',
        'gateway',
        'live gateway',
        'medialib',
        'signals',
        'items-core',
      ];
      function repoClass(repo) {
        return KNOWN_REPOS.includes(repo) ? 'r-' + repo.replace(/\s+/g, '-') : 'r-other';
      }
      function reposOf(f) {
        return [...new Set(f.where.map((w) => w.repo))];
      }
      function whereHtml(where) {
        return where
          .map(
            (w) =>
              `<span class="repo ${repoClass(w.repo)}">${escape(w.repo)}</span> › ${inline(w.part)}`,
          )
          .join(' · ');
      }
      const whereText = (where) => (where ?? []).map((w) => `${w.repo} › ${w.part}`).join(' · ');

      function kindOf(f) {
        return KIND_OF[f.status] ?? 'none';
      }
      function chipsHtml(f) {
        const cancelled = cancelledOf(f);
        const chips = [
          cancelled
            ? '<span class="chip s-cancelled">Cancelled</span>'
            : `<span class="chip s-${kindOf(f)}">${escape(f.status)}</span>`,
        ];
        if (!cancelled && f.design && f.status !== 'Designed')
          chips.push('<span class="chip s-designed">Designed</span>');
        if (!cancelled && f.waitingOn)
          chips.push(
            `<span class="chip s-waiting" title="${escape(f.waitingOn.join(', '))}">Waiting</span>`,
          );
        return `<span class="chips">${chips.join('')}</span>`;
      }
      /** Done of a set of tickets, cancelled ones left out: a bar, then "3/8" or, with `words`, "3 of 8 tickets done". */
      function progressHtml(tasks, words) {
        const live = tasks.filter((t) => !cancelledOf(t));
        if (!live.length) return '';
        const done = live.filter((t) => t.done).length;
        const pct = Math.round((done / live.length) * 100);
        const text = words ? `${done} of ${live.length} tickets done` : `${done}/${live.length}`;
        return `<span class="progress"><span class="meter" aria-hidden="true"><span style="width:${pct}%"></span></span>${text}</span>`;
      }
      /** An item's children: an epic's features, a feature's tickets, a ticket's subtickets. */
